 pl.onclick=()=>{const rw=h('div','addrow'),ip=h('input');ip.type='text';ip.maxLength=80;ip.setAttribute('aria-label','任务内容');
  const ok=h('button','','加'),add=()=>{const v=ip.value.trim();if(!v)return;(custom[r[0]]=custom[r[0]]||[]).push({i:Date.now().toString(36),s:v});save();render()};
  ok.type='button';ok.onclick=add;ip.onkeydown=ev=>{if(ev.key==='Enter')add()};rw.append(ip,ok);ad.replaceChildren(rw);ip.focus()};
 ad.append(pl);c.append(ad);
 el.append(c);const[a,b]=prog(cur);
 el.append(h('p','sub',a+' / '+b+' 项。做不完时按这个顺序保：网课、当天习题、错题重做、英语、政治。没做完的不往后堆，周日统一清一次。'));
 const cnt={视频:0,习题:0,回做:0,英语:0,化工:0,政治:0};let late=0,first=-1;
 P.forEach((_,i)=>tasks(i).forEach(t=>{if(done[t.id]||t.g==='选做')return;if(t.k in cnt&&(t.k!=='视频'||t.id.slice(0,5) in VID))cnt[t.k]++;if(i<TODAY){late++;if(first<0)first=i}}));
 const rc=h('div','card');rc.append(h('div','g','阶段一还剩'));const gr=h('div','grid');
 for(const k in cnt){const x=h('div','cell');x.append(h('b','',cnt[k]),h('span','',U[k]));gr.append(x)}
 rc.append(gr);
 rc.append(h('div','g','完成热力图'));const hm=h('div','hm');['一','二','三','四','五','六','日'].forEach(w=>hm.append(h('i','hw',w)));
 for(let q=0;q<35;q++){const dt=new Date(YR,9,12+q),dk=pad(dt.getMonth()+1)+'-'+pad(dt.getDate()),ix=P.findIndex(x=>x[0]===dk);
  if(ix<0){hm.append(h('i','hc e'));continue}
  const[da,db]=prog(ix),rt=db?da/db:0,bt=h('button','hc'+(ix===TODAY?' now':'')+(ix<TODAY&&da<db?' lag':'')+(ix>TODAY&&!da?' fut':''));
  bt.style.setProperty('--p',(rt?Math.round(rt*65)+10:0)+'%');bt.append(h('b','',dt.getDate()),h('span','',da+'/'+db));if(EN[dk])bt.append(h('u'));
  bt.setAttribute('aria-label',lab(P[ix])+' 完成 '+da+'/'+db);bt.onclick=()=>{cur=ix;view='today';render()};hm.append(bt)}
 rc.append(hm,h('p','sub','颜色越深完成越多，红框是落下的日子，蓝点是有英语课，点日期可跳转。'));
 if(late){const b2=h('button','late','落下 '+late+' 项，去看最早落下的一天');b2.onclick=()=>{cur=first;render()};rc.append(b2)}
 el.append(rc)}
function renderPlan(){const el=$('#plan');el.replaceChildren();
 P.forEach((r,i)=>{const[a,b]=prog(i),bt=h('button','row'+(i===TODAY?' now':'')+(i<TODAY&&a<b?' lag':''));
  bt.append(h('span','',lab(r)+' '+wd(r)),h('span','',(EN[r[0]]?'英语课':r[0] in VID?VID[r[0]]||'无网课':r[1])||r[2].split('：')[0].slice(0,14)),h('span','ct',a+'/'+b));
  if(r[5])bt.append(h('em','ck',r[5].split('：')[0]));
  bt.onclick=()=>{cur=i;view='today';render()};el.append(bt)});
 const dt=document.createElement('details');dt.className='bk';if(bkMsg)dt.open=true;
 const sm=h('summary','','备份记录');const ta=document.createElement('textarea');ta.rows=4;ta.placeholder='导出的内容会出现在这里；导入时把备份内容粘贴到这里';ta.setAttribute('aria-label','备份内容');
 const msg=h('div','bkm',bkMsg);bkMsg='';
 const ex=h('button','','导出'),im=h('button','','导入'),rw=h('div','addrow');ex.type=im.type='button';let armed=0;
 ex.onclick=async()=>{const t=JSON.stringify({v:1,at:new Date().toISOString().slice(0,16),done,custom,moved});ta.value=t;ta.select();
  let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
  msg.textContent=ok?'已导出并复制，粘贴到备忘录或文件传输助手保存即可':'已导出到上面的框里，长按全选后复制保存'};
 im.onclick=()=>{let o;try{o=JSON.parse(ta.value.trim())}catch(e){}
  if(!o||typeof o!=='object'||typeof o.done!=='object'||o.done===null){msg.textContent='内容不对，请把导出的整段文字完整粘贴进来';armed=0;im.textContent='导入';return}
  if(!armed){armed=1;im.textContent='再点一次，覆盖当前记录';msg.textContent='导入会用备份替换现在的打勾和自加任务记录';return}
  const cl=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
  done=cl(o.done);custom=cl(o.custom);moved=cl(o.moved);save();bkMsg='已导入'+Object.keys(done).filter(k=>done[k]).length+'项打勾记录';render()};
 const cp=h('button','','复制');cp.type='button';
 cp.onclick=async()=>{if(!ta.value.trim()){msg.textContent='框里还没有内容，先点“导出”';return}
  ta.select();let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}
  msg.textContent=ok?'已复制':'复制没成功，长按框里的文字全选后手动复制'};
 rw.append(ex,cp,im);dt.append(sm,ta,rw,msg);el.append(dt)}
let bkMsg='';
function render(){
 ['today','plan'].forEach(v=>{$('#'+v).hidden=v!==view});
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view));
 let a=0,b=0;P.forEach((_,i)=>{const p=prog(i);a+=p[0];b+=p[1]});
 $('#bar').style.width=(100*a/b)+'%';$('#bt').textContent='阶段一已完成 '+a+' / '+b+' 项';renderToday();renderPlan()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
// 进度保存：优先服务器端私有数据，失败则用浏览器存储
async function initStore(){
 try{const user=await claude.use('user'),db=await claude.use('db');
  if(user&&db){const id=await user.id();
   if(id){const ref=db.doc('data/users/'+id+'/progress'),s=await ref.get();if(s.exists){done=JSON.parse(JSON.stringify(s.data().done||{}));custom=JSON.parse(JSON.stringify(s.data().custom||{}));moved=JSON.parse(JSON.stringify(s.data().moved||{}))}
    let q=Promise.resolve();save=()=>{q=q.then(()=>ref.set({done,custom,moved})).catch(()=>{})};render();return}}}catch(e){}
 try{done=JSON.parse(localStorage.getItem('kyDone')||'{}');custom=JSON.parse(localStorage.getItem('kyCustom')||'{}');moved=JSON.parse(localStorage.getItem('kyMoved')||'{}')}catch(e){}
 save=()=>{try{localStorage.setItem('kyDone',JSON.stringify(done));localStorage.setItem('kyCustom',JSON.stringify(custom));localStorage.setItem('kyMoved',JSON.stringify(moved))}catch(e){}};render()}
render();initStore();
</script></body></html>
