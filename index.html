<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>植物生长 demo</title>
<style>
:root{--bg:#e6eee4;--ink:#1f3326;--soft:#5d7565;--stem:#4a6b3a;--leaf1:#6f9f4a;--leaf2:#a3c45a;--leafd:#4c7d38;--bloom:#f6d3d8;--bloomc:#e9b44c;--bloomd:#dd8499;--bloomm:#efb3c0;--potd:#a9bda6;--potl:#dbe7d7;--soil:#7a5c43;--pot:#c9d8c5;--btn:#2f5a3c;--btnt:#f2f7ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--ink:#dce8d8;--soft:#8fa795;--stem:#7fa062;--leaf1:#8fbf5f;--leaf2:#c2de72;--leafd:#5f9546;--bloom:#f2c4cc;--bloomd:#c46a82;--bloomm:#e29fb0;--potd:#1a291f;--potl:#33503d;--soil:#6b5039;--pot:#223328;--btn:#a9cf86;--btnt:#14201a}}
:root[data-theme="dark"]{--bg:#14201a;--ink:#dce8d8;--soft:#8fa795;--stem:#7fa062;--leaf1:#8fbf5f;--leaf2:#c2de72;--leafd:#5f9546;--bloom:#f2c4cc;--bloomd:#c46a82;--bloomm:#e29fb0;--potd:#1a291f;--potl:#33503d;--soil:#6b5039;--pot:#223328;--btn:#a9cf86;--btnt:#14201a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
main{width:100%;max-width:420px;padding:20px 20px 32px;box-sizing:border-box}
h1{font-size:20px;margin:8px 0 2px;font-weight:600}
p.sub{margin:0 0 8px;color:var(--soft);font-size:14px}
svg{width:100%;height:auto;display:block}
.sway{transform-origin:150px 267.8px;animation:sway 5s ease-in-out infinite alternate}
.dormant .sway{animation:none}
.dormant svg{filter:saturate(.35) brightness(.95)}
@keyframes sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
@media (prefers-reduced-motion:reduce){.sway{animation:none}}
.stage{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 4px}
.stage b{font-size:18px}
.stage span{color:var(--soft);font-size:14px}
input[type=range]{width:100%;accent-color:var(--btn);margin:8px 0 14px}
.row{display:flex;gap:10px}
button{flex:1;font:inherit;font-size:15px;padding:11px 0;border-radius:10px;border:1.5px solid var(--btn);background:transparent;color:var(--ink);cursor:pointer}
button.on{background:var(--btn);color:var(--btnt)}
button:focus-visible,input:focus-visible{outline:3px solid var(--leaf2);outline-offset:2px}
.note{margin-top:14px;font-size:13px;color:var(--soft);line-height:1.6;min-height:42px}
</style>
</head>
<body>
<main id="app">
  <h1>此事有记 · 植物 demo</h1>
  <p class="sub">全部由代码生成，没有任何图片素材</p>
  <svg id="s" viewBox="0 0 300 320" role="img" aria-label="随打卡天数生长的植物"></svg>
  <div class="stage"><b id="st"></b><span id="dv"></span></div>
  <input id="r" type="range" min="0" max="60" value="30" aria-label="连续打卡天数">
  <div class="row">
    <button id="seed">换一株</button>
    <button id="dor" aria-pressed="false">模拟断签</button>
  </div>
  <div class="note" id="nt"></div>
</main>
<script>
(function(){
var svg=document.getElementById('s'),r=document.getElementById('r'),st=document.getElementById('st'),dv=document.getElementById('dv'),nt=document.getElementById('nt'),app=document.getElementById('app'),dor=document.getElementById('dor');
var seed=7,dormant=false,D=4,tree;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var f1=function(v){return v.toFixed(1)};

/* 整株植物的形状只在这里生成一次，之后天数变化只改变"长到哪一步" */
function build(sd){
  var R=rng(sd),terms=[];
  function mk(a,len,w,d){
    var n={a:a,len:len,w:w,d:d,bend:(R()-.5)*.7,leaves:[],kids:[],tip:null,fl:null};
    var nl=d===0?3:2;
    for(var i=0;i<nl;i++)n.leaves.push({t:.25+.45*R(),side:i%2?1:-1,ang:45+R()*25,s:(7+R()*3)*(1.1-d*.1),tone:R()>.5});
    if(d<D){
      var k=1+(R()>.35?1:0);
      for(var j=0;j<k;j++){
        var da=(j===0?-1:1)*(18+R()*28)*(k===1?(R()>.5?1:-1):1);
        n.kids.push(mk(a+da,len*(.68+R()*.1),w*.68,d+1));
      }
    }else{n.tip={ang:(R()-.5)*30,s:10,tone:R()>.5};terms.push(n);}
    return n;
  }
  var root=mk(-90,58,6,0),fl=[];
  terms.forEach(function(n){if(R()>.35)fl.push(n)});
  if(!fl.length)fl.push(terms[0]);
  /* 每朵花有自己的开始时间：先后依次开，第 45 天起到第 60 天全部盛开 */
  fl.forEach(function(n,i){n.fl={s:.75+.14*(i/Math.max(1,fl.length-1)),r:(i*29)%72}});
  return {root:root,N:fl.length};
}

function leaf(arr,x,y,a,s,tone){
  if(s<1.2)return;
  var L=s*1.9,w=s*.55,c=tone?'var(--leaf1)':'var(--leaf2)';
  arr.push('<g transform="translate('+f1(x)+' '+f1(y)+')rotate('+(a+90).toFixed(0)+')"><path d="M0 0C'+w+' '+(-L*.2)+' '+w*.9+' '+(-L*.7)+' 0 '+(-L)+'C'+(-w*.9)+' '+(-L*.7)+' '+(-w)+' '+(-L*.2)+' 0 0Z" fill="'+c+'"/><path d="M0 0C'+(-w)+' '+(-L*.2)+' '+(-w*.9)+' '+(-L*.7)+' 0 '+(-L)+'Z" fill="var(--leafd)" opacity=".35"/><path d="M0 0L0 '+(-L*.85)+'" stroke="var(--leafd)" stroke-width=".7" opacity=".7" stroke-linecap="round"/></g>');
}

/* 花瓣：顶端有浅缺口，底部颜色深、向外变浅，带中脉和两条侧脉 */
function petal(h,w,fill,rot){
  var d='M0 0C'+(-w*.9)+' '+(-h*.25)+' '+(-w*.8)+' '+(-h*.88)+' '+(-w*.2)+' '+(-h)+'Q0 '+(-h*.9)+' '+(w*.2)+' '+(-h)+'C'+(w*.8)+' '+(-h*.88)+' '+(w*.9)+' '+(-h*.25)+' 0 0Z';
  var v='<path d="M0 -.5L0 '+(-h*.78)+'M0 '+(-h*.25)+'L'+(-w*.42)+' '+(-h*.6)+'M0 '+(-h*.25)+'L'+(w*.42)+' '+(-h*.6)+'" stroke="var(--bloomd)" stroke-opacity=".4" stroke-width=".35" fill="none" stroke-linecap="round"/>';
  return '<g transform="rotate('+rot+')"><path d="'+d+'" fill="url(#'+fill+')" stroke="var(--bloomd)" stroke-opacity=".35" stroke-width=".4"/>'+v+'</g>';
}
function sepals(ang,len){
  var o='';
  ang.forEach(function(k){o+='<path d="M0 0C'+(-len*.35)+' '+(-len*.25)+' '+(-len*.3)+' '+(-len*.7)+' 0 '+(-len)+'C'+(len*.3)+' '+(-len*.7)+' '+(len*.35)+' '+(-len*.25)+' 0 0Z" fill="var(--leafd)" transform="rotate('+k+')"/>';});
  return o;
}
/* 花的阶段：0 未开始 → 1 花苞 → 2 半开 → 3 大开(杯状) → 4 盛开(平展) */
function flower(arr,x,y,a,f,g){
  var t=(g-f.s)/.11,stg=t<0?0:t<.25?1:t<.5?2:t<.75?3:4,k,px,py;
  var o='<g transform="translate('+f1(x)+' '+f1(y)+')rotate('+(a+90).toFixed(0)+')">';
  if(stg===0){
    o+='<ellipse rx="2" ry="2.4" fill="var(--leafd)"/>';
  }else if(stg===1){
    o+='<path d="M0 0C-3.6 -2 -3.4 -7.4 0 -10C3.4 -7.4 3.6 -2 0 0Z" fill="url(#petal)" stroke="var(--bloomd)" stroke-opacity=".4" stroke-width=".4"/>'
     +'<path d="M-1 -.8C-2.8 -4 -1.8 -7.4 .4 -9.6" stroke="var(--bloomd)" stroke-opacity=".5" stroke-width=".45" fill="none" stroke-linecap="round"/>'
     +sepals([-26,0,26],4.8);
  }else if(stg===2){
    o+=petal(9.4,3.4,'petalb',-42)+petal(9.4,3.4,'petalb',42);
    o+='<circle cy="-3" r="1.4" fill="var(--bloomc)"/>';
    o+=petal(8.8,3.2,'petal',-18)+petal(9.6,3.5,'petal',0)+petal(8.8,3.2,'petal',18);
    o+=sepals([-45,0,45],4);
  }else if(stg===3){
    o+=petal(11.5,4.6,'petalb',-66)+petal(11.5,4.6,'petalb',66);
    o+=petal(10.8,4.4,'petal',-36)+petal(10.8,4.4,'petal',36)+petal(11.2,4.6,'petal',0);
    for(k=-2;k<=2;k++){
      px=k*1.9;py=-6.4+Math.abs(k)*.8;
      o+='<path d="M0 -1.5L'+f1(px)+' '+f1(py)+'" stroke="var(--bloomd)" stroke-opacity=".65" stroke-width=".35"/><circle cx="'+f1(px)+'" cy="'+f1(py)+'" r=".85" fill="var(--bloomc)"/>';
    }
    o+=sepals([-50,0,50],4.2);
  }else{
    o+='<g transform="rotate('+f.r+')"><ellipse rx="2.6" ry="3" fill="var(--leafd)"/>';
    for(k=0;k<5;k++)o+=petal(12.4,5,'petalb',k*72+36);
    for(k=0;k<5;k++)o+=petal(11,4.6,'petal',k*72);
    for(k=0;k<9;k++){
      var an=k*40*Math.PI/180,rr=3.6+(k%2)*1.1;
      px=Math.cos(an)*rr;py=Math.sin(an)*rr;
      o+='<path d="M0 0L'+f1(px)+' '+f1(py)+'" stroke="var(--bloomd)" stroke-opacity=".6" stroke-width=".35"/><circle cx="'+f1(px)+'" cy="'+f1(py)+'" r=".85" fill="var(--bloomc)"/>';
    }
    o+='<circle r="1.9" fill="var(--leaf2)"/><circle r=".8" fill="var(--bloomc)"/></g>';
  }
  arr.push(o+'</g>');
  return stg;
}

function draw(days){
  var g=days/60,gg=Math.min(1,g/.75),sm=[],lv=[],fw=[],cnt=[0,0,0,0,0];
  function rb(n,x,y,ux,uy){
    var p=clamp(gg*(D+1)-n.d,0,1);
    if(p<=0)return;
    var L=n.len*p,rad=n.a*Math.PI/180,e=rad+n.bend,dx=Math.cos(rad),dy=Math.sin(rad);
    var ex=x+Math.cos(e)*L,ey=y+Math.sin(e)*L;
    /* 三次贝塞尔：起点切线=父枝梢方向，终点切线=n.a，枝与枝之间没有折角 */
    var x1=x+ux*L*.45,y1=y+uy*L*.45,x2=ex-dx*L*.4,y2=ey-dy*L*.4;
    function bz(t){var u=1-t;return [
      u*u*u*x+3*u*u*t*x1+3*u*t*t*x2+t*t*t*ex,
      u*u*u*y+3*u*u*t*y1+3*u*t*t*y2+t*t*t*ey,
      3*u*u*(x1-x)+6*u*t*(x2-x1)+3*t*t*(ex-x2),
      3*u*u*(y1-y)+6*u*t*(y2-y1)+3*t*t*(ey-y2)];}
    /* 枝条是上细下粗的锥形：底宽=n.w（子枝底宽恰好等于父枝梢宽，衔接无台阶）；
       还在长、或没有子枝的枝梢收成尖头；长齐且有子枝的枝梢留平口，由子枝接住 */
    var hk=n.kids.length>0,bw=n.d===0?n.w*(.45+.55*p):n.w,tw=bw*(hk?.3+.38*p:.3),pt=p<1||!hk;
    var lp=[],rp=[],i,q,t0,h,m,N=12,kk;
    for(i=0;i<=N;i++){
      t0=i/N;q=bz(t0);m=Math.sqrt(q[2]*q[2]+q[3]*q[3])||1;
      h=(bw+(tw-bw)*t0)/2;
      if(pt&&t0>.7)h*=Math.pow((1-t0)/.3,.7);
      lp.push(f1(q[0]-q[3]/m*h)+' '+f1(q[1]+q[2]/m*h));
      rp.push(f1(q[0]+q[3]/m*h)+' '+f1(q[1]-q[2]/m*h));
    }
    var ap='';
    sm.push('<path d="M'+lp.join('L')+ap+'L'+rp.reverse().join('L')+'Z" fill="var(--stem)" stroke="var(--stem)" stroke-width=".4" stroke-linejoin="round"/>');
    n.leaves.forEach(function(l){
      var qq=clamp((p-l.t)/.25,0,1);
      if(qq<=0)return;
      /* 叶子长在曲线上的真实位置，再用一小段叶柄连到叶片 */
      var c=bz(l.t),bx=c[0],by=c[1];
      var la=Math.atan2(c[3],c[2])*180/Math.PI+l.side*l.ang,s=l.s*qq,pl=s*.5;
      var lx=bx+Math.cos(la*Math.PI/180)*pl,ly=by+Math.sin(la*Math.PI/180)*pl;
      sm.push('<path d="M'+f1(bx)+' '+f1(by)+'L'+f1(lx)+' '+f1(ly)+'" stroke="var(--stem)" stroke-width=".9" stroke-linecap="round"/>');
      leaf(lv,lx,ly,la,s,l.tone);
    });
    if(n.tip&&!n.fl)leaf(lv,ex,ey,n.a+n.tip.ang,n.tip.s*clamp((p-.5)/.5,0,1),n.tip.tone);
    if(n.fl&&p>.99)cnt[flower(fw,ex,ey,n.a,n.fl,g)]++;
    n.kids.forEach(function(k){rb(k,ex,ey,dx,dy)});
  }
  var base='<defs>'
   +'<linearGradient id="petal" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--bloomd)"/><stop offset=".5" style="stop-color:var(--bloom)"/><stop offset="1" style="stop-color:var(--bloom)"/></linearGradient>'
   +'<linearGradient id="petalb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--bloomd)"/><stop offset="1" style="stop-color:var(--bloomm)"/></linearGradient>'
   +'<linearGradient id="potg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--potd)"/><stop offset=".3" style="stop-color:var(--pot)"/><stop offset=".62" style="stop-color:var(--pot)"/><stop offset="1" style="stop-color:var(--potd)"/></linearGradient>'
   +'<linearGradient id="potm" gradientUnits="userSpaceOnUse" x1="0" y1="276" x2="0" y2="298"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>'
   +'<linearGradient id="rimsh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>'
   +'<clipPath id="potclip"><path d="M99 278H201L191 312H109Z"/></clipPath>'
   +'<mask id="potmask" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="320"><rect width="300" height="320" fill="url(#potm)"/></mask></defs>'
   +'<g mask="url(#potmask)"><path d="M99 278H201L191 312H109Z" fill="url(#potg)"/>'
   +'<rect x="90" y="278" width="120" height="14" fill="url(#rimsh)" clip-path="url(#potclip)"/>'
   +'<path d="M107 288L113 307" stroke="var(--potl)" stroke-width="3" stroke-linecap="round" fill="none" opacity=".45"/>'
   +'<path d="M93.2 268.5C92.2 268.9 91.8 271 91.8 272.6C91.8 274.5 92.4 275.9 93.6 276.6A56.4 6.2 0 0 0 206.4 276.6C207.6 275.9 208.2 274.5 208.2 272.6C208.2 271 207.8 268.9 206.8 268.5Z" fill="url(#potg)"/>'
   +'<ellipse cx="150" cy="268.5" rx="56.8" ry="6" fill="url(#potg)"/>'
   +'<ellipse cx="150" cy="268.5" rx="56.8" ry="6" fill="var(--potl)" opacity=".4"/>'
   +'<ellipse cx="150" cy="268.3" rx="52" ry="5.4" fill="var(--potd)"/></g>'
   +'<ellipse cx="150" cy="268.9" rx="51" ry="4.6" fill="var(--soil)"/>'
   +'<g fill="#000" opacity=".22"><circle cx="124" cy="268.6" r=".9"/><circle cx="137" cy="270.4" r=".8"/><circle cx="165" cy="270" r=".9"/><circle cx="178" cy="267.8" r=".8"/></g>'
   +'<g fill="#fff" opacity=".16"><circle cx="131" cy="267" r=".8"/><circle cx="158" cy="270.6" r=".7"/><circle cx="171" cy="268.2" r=".8"/></g>';
  var body;
  if(days<1){
    body='<ellipse cx="150" cy="267.8" rx="6" ry="4" fill="var(--soil)" stroke="var(--stem)" stroke-width="1.5"/>';
  }else{
    rb(tree.root,150,267.8,0,-1);
    body='<g class="sway">'+sm.join('')+lv.join('')+fw.join('')+'</g>';
  }
  /* 土堆：与土面同色，去掉下沿的深色线，直接融进土面 */
  var mound=days<1?'':'<g transform="translate(0 1.8)"><path d="M139 268.4Q144 261.8 150 262.2Q156 261.8 161 268.4Q150 271.4 139 268.4Z" fill="var(--soil)"/><path d="M144 264.6Q150 261.6 156 264.6" stroke="#fff" stroke-opacity=".16" stroke-width="1.1" fill="none" stroke-linecap="round"/><g fill="#000" opacity=".22"><circle cx="144.5" cy="266.6" r=".75"/><circle cx="155.5" cy="266" r=".65"/></g></g>';
  svg.innerHTML=base+body+mound;
  var N=tree.N,name;
  if(days<1)name='一颗种子';
  else if(days<7)name='发芽';
  else if(days<21)name='长叶';
  else if(cnt[4]===N)name='盛开';
  else if(cnt[2]+cnt[3]+cnt[4]>0)name='开花';
  else if(cnt[1]>0)name='结花苞';
  else name='分枝';
  st.textContent=name;
  dv.textContent='连续 '+days+' 天';
}
function note(){
  nt.textContent=dormant?'断签后植物进入休眠：停止生长、颜色变淡、不再摇晃，但不会枯死。打卡一次就恢复。':'拖动滑块看生长过程。45 天后花会依次经历花苞、半开、大开、盛开，先后有别。';
}
function upd(){draw(+r.value);}
tree=build(seed);
r.addEventListener('input',upd);
document.getElementById('seed').addEventListener('click',function(){seed=Math.floor(Math.random()*99999)+1;tree=build(seed);upd();});
dor.addEventListener('click',function(){
  dormant=!dormant;app.classList.toggle('dormant',dormant);
  dor.classList.toggle('on',dormant);dor.setAttribute('aria-pressed',dormant);
  dor.textContent=dormant?'打卡恢复':'模拟断签';note();
});
note();upd();
})();
</script>
</body>
</html>
