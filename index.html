<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>黄金指挥官</title>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --text:#2b241c; --sub:#8a7f6e;
  --accent:#c8873a; --accent2:#7a9a6b; --line:#e8e1d3; --danger:#c25b4a; --gold:#e0a83c;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1c1a16;--card:#28241e;--text:#eee6d8;--sub:#9c9285;--accent:#e0a860;--accent2:#8fb97e;--line:#3a352c;--danger:#e0796a;--gold:#f0c26a;}
}
:root[data-theme="dark"]{--bg:#1c1a16;--card:#28241e;--text:#eee6d8;--sub:#9c9285;--accent:#e0a860;--accent2:#8fb97e;--line:#3a352c;--danger:#e0796a;--gold:#f0c26a;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100%;}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px;}
h1{font-size:21px;text-align:center;margin:6px 0 2px;}
.tag{text-align:center;color:var(--sub);font-size:12.5px;margin-bottom:12px;}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;}
.tab-btn{flex:1;padding:9px 4px;border:none;background:transparent;border-radius:10px;font-size:13.5px;color:var(--sub);cursor:pointer;font-weight:600;}
.tab-btn.active{background:var(--accent);color:#fff;}
.page{display:none;} .page.active{display:block;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;}
.card h2{font-size:14.5px;margin:0 0 10px;color:var(--sub);font-weight:700;}
.opts{display:flex;flex-wrap:wrap;gap:7px;}
.opt{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:7px 9px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:5px;line-height:1.25;user-select:none;transition:all .12s;}
.opt.big{flex-direction:column;min-width:64px;text-align:center;padding:9px 5px;}
.opt.big .ic{font-size:20px;}
.opt.sel{border-color:var(--accent);background:var(--accent);color:#fff;}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15);}
.submit{width:100%;padding:13px;border:none;border-radius:14px;background:var(--accent2);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:2px;}
.submit:active{opacity:.85;}
/* 等级卡 */
.lvcard{background:linear-gradient(135deg,var(--gold),var(--accent));color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;}
.lvtop{display:flex;justify-content:space-between;align-items:baseline;}
.lvname{font-size:16px;font-weight:800;}
.lvnum{font-size:12px;opacity:.9;}
.xpbar{height:12px;background:rgba(255,255,255,.35);border-radius:7px;overflow:hidden;margin-top:8px;}
.xpfill{height:100%;background:#fff;border-radius:7px;transition:width .4s;}
.xptext{font-size:11px;margin-top:4px;opacity:.9;text-align:right;}
.stat-row{display:flex;gap:10px;margin-bottom:14px;}
.stat-box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center;}
.stat-box .num{font-size:20px;font-weight:800;color:var(--accent);}
.stat-box .lbl{font-size:10.5px;color:var(--sub);margin-top:2px;}
.analysis{font-size:13.5px;line-height:1.7;}
.analysis b{color:var(--accent);}
/* donut */
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;}
.legend{flex:1;min-width:140px;font-size:12px;}
.legend-row{display:flex;align-items:center;gap:6px;margin:4px 0;}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
/* bubble mood */
.bubbles{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;padding:6px 0;}
.bubble{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--bg);border:2px solid var(--accent2);color:var(--text);text-align:center;}
.bubble b{font-size:11px;}
/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.cal-head button{border:none;background:var(--bg);color:var(--text);border-radius:8px;padding:5px 10px;font-size:14px;cursor:pointer;}
.cal-title{font-weight:700;font-size:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-grid .wd{font-size:10px;color:var(--sub);padding-bottom:2px;}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--bg);color:var(--sub);position:relative;}
.cal-day.has1{background:#e0b25a55;color:var(--text);}
.cal-day.has2{background:#d99a3fa0;color:#fff;}
.cal-day.has3{background:var(--accent);color:#fff;font-weight:700;}
.cal-day.today{outline:2px solid var(--accent2);}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;margin:3px 4px 0 0;}
.entry{border-bottom:1px solid var(--line);padding:10px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.entry:last-child{border-bottom:none;}
.entry .meta{color:var(--sub);font-size:11px;margin-top:2px;}
.del{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px;}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:26px 0;}
/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--card);border:1.5px solid var(--gold);border-radius:14px;padding:12px 16px;max-width:88%;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:all .3s;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .ttl{font-weight:800;color:var(--gold);margin-bottom:4px;font-size:14px;}
.toast .msg{font-size:12.5px;line-height:1.5;color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <h1>💩 黄金指挥官</h1>
  <div class="tag">记录每一次「大」事，升级你的黄金战绩</div>

  <div class="tabs">
    <button class="tab-btn active" data-p="record">打卡</button>
    <button class="tab-btn" data-p="stats">统计</button>
    <button class="tab-btn" data-p="history">历史</button>
  </div>

  <div class="page active" id="page-record">
    <div class="card"><h2>💩 形状（布里斯托分类）</h2><div class="opts" id="opt-type"></div></div>
    <div class="card"><h2>🎨 颜色</h2><div class="opts" id="opt-color"></div></div>
    <div class="card"><h2>📏 分量</h2><div class="opts" id="opt-size"></div></div>
    <div class="card"><h2>👃 气味</h2><div class="opts" id="opt-smell"></div></div>
    <div class="card"><h2>🧘 当时状态</h2><div class="opts" id="opt-mood"></div></div>
    <div class="card"><h2>⏱️ 用时</h2><div class="opts" id="opt-duration"></div></div>
    <div class="card"><h2>📍 地点</h2><div class="opts" id="opt-place"></div></div>
    <button class="submit" id="btnSave">✅ 完成打卡</button>
  </div>

  <div class="page" id="page-stats">
    <div class="lvcard">
      <div class="lvtop"><div class="lvname" id="lvName">Lv.1 厕所新手</div><div class="lvnum" id="lvXP">0 XP</div></div>
      <div class="xpbar"><div class="xpfill" id="xpFill" style="width:0%"></div></div>
      <div class="xptext" id="xpNext">还需 60 XP 升级</div>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="num" id="statWeek">0</div><div class="lbl">本周次数</div></div>
      <div class="stat-box"><div class="num" id="statStreak">0</div><div class="lbl">连续打卡天数</div></div>
      <div class="stat-box"><div class="num" id="statTotal">0</div><div class="lbl">累计次数</div></div>
    </div>
    <div class="card"><h2>🔍 智能分析</h2><div class="analysis" id="analysisBox">暂无数据，快去打卡吧～</div></div>
    <div class="card"><h2>💩 形状占比</h2><div class="donut-wrap"><div class="donut" id="typeDonut"></div><div class="legend" id="typeLegend"></div></div></div>
    <div class="card"><h2>🕐 如厕时段分布</h2><div class="donut-wrap"><div class="donut" id="timeDonut"></div><div class="legend" id="timeLegend"></div></div><div class="analysis" id="timeSummary" style="margin-top:8px"></div></div>
    <div class="card"><h2>🧘 状态气泡</h2><div class="bubbles" id="moodBubbles"></div></div>
    <div class="card">
      <div class="cal-head"><button id="calPrev">‹</button><div class="cal-title" id="calTitle"></div><button id="calNext">›</button></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="card"><h2>🏅 成就</h2><div id="badges"></div></div>
  </div>

  <div class="page" id="page-history">
    <div class="card" id="historyList"><div class="empty">还没有记录</div></div>
  </div>
</div>
<div class="toast" id="toast"><div class="ttl" id="toastTtl"></div><div class="msg" id="toastMsg"></div></div>

<script>
const TYPES=[
 {id:1,ic:'🐑',name:'羊球状',desc:'硬块,便秘',color:'#9c6b3f'},
 {id:2,ic:'🌰',name:'香肠块状',desc:'偏硬',color:'#b07d3f'},
 {id:3,ic:'🌭',name:'带裂纹',desc:'正常',color:'#c8873a'},
 {id:4,ic:'🍌',name:'光滑香肠',desc:'完美',color:'#d9b23c'},
 {id:5,ic:'🟤',name:'软块状',desc:'偏软',color:'#a68a5a'},
 {id:6,ic:'💧',name:'糊状',desc:'较稀',color:'#7a9a6b'},
 {id:7,ic:'🌊',name:'水状',desc:'腹泻',color:'#5a8ab0'},
];
const COLORS=[
 {id:'棕色',dot:'#7a5230'},{id:'黄色',dot:'#d9b23c'},{id:'深褐',dot:'#4a3220'},
 {id:'绿色',dot:'#6a8a4a'},{id:'黑色',dot:'#2a2420'},{id:'偏红',dot:'#b0473b'},
 {id:'橙色',dot:'#d9793c'},{id:'灰白',dot:'#b8b0a2'},
];
const SIZES=[{id:'迷你',ic:'🫘'},{id:'小',ic:'🥚'},{id:'中',ic:'🍆'},{id:'大',ic:'🎃'},{id:'超大',ic:'🦕'}];
const SMELLS=[{id:'无味',ic:'😶'},{id:'轻微',ic:'🌸'},{id:'正常',ic:'😐'},{id:'浓烈',ic:'☣️'},{id:'爆炸级',ic:'🧨'}];
const MOODS=[
 {id:'轻松愉悦',ic:'😌'},{id:'畅快淋漓',ic:'🤩'},{id:'平平无奇',ic:'😐'},
 {id:'有点费力',ic:'😣'},{id:'非常痛苦',ic:'😖'},{id:'意犹未尽',ic:'🤔'},
];
const DURATIONS=[{id:'<1分钟',ic:'⚡'},{id:'1-3分钟',ic:'🙂'},{id:'3-8分钟',ic:'📱'},{id:'8分钟以上',ic:'🐌'}];
const PLACES=[{id:'家里',ic:'🏠'},{id:'公司/学校',ic:'🏢'},{id:'外面',ic:'🌆'}];

let sel={type:null,color:null,size:null,smell:null,mood:null,duration:null,place:null};

function buildOpts(containerId,list,key,big){
  const c=document.getElementById(containerId); c.innerHTML='';
  list.forEach(item=>{
    const btn=document.createElement('div');
    btn.className='opt'+(big?' big':'');
    let inner='';
    if(item.dot) inner+=`<span class="dot" style="background:${item.dot}"></span>`;
    if(item.ic) inner+=big?`<span class="ic">${item.ic}</span>`:`<span>${item.ic}</span>`;
    inner+=`<span>${item.name||item.id}${item.desc?`<br><small style="opacity:.75">${item.desc}</small>`:''}</span>`;
    btn.innerHTML=inner;
    btn.onclick=()=>{ c.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); btn.classList.add('sel'); sel[key]=item.id; };
    c.appendChild(btn);
  });
}
buildOpts('opt-type',TYPES,'type',true);
buildOpts('opt-color',COLORS,'color');
buildOpts('opt-size',SIZES,'size');
buildOpts('opt-smell',SMELLS,'smell');
buildOpts('opt-mood',MOODS,'mood');
buildOpts('opt-duration',DURATIONS,'duration');
buildOpts('opt-place',PLACES,'place');

function loadData(){ try{ const r=localStorage.getItem('poop_entries'); return r?JSON.parse(r):[]; }catch(e){ return []; } }
function saveData(list){ try{ localStorage.setItem('poop_entries',JSON.stringify(list)); }catch(e){} }

/* ---------- XP 系统 ---------- */
const LEVELS=[
 {lv:1,name:'厕所新手',need:0},{lv:2,name:'如厕学徒',need:60},{lv:3,name:'黄金瞄准手',need:150},
 {lv:4,name:'排便达人',need:280},{lv:5,name:'厕所大师',need:450},{lv:6,name:'黄金指挥官',need:680},
 {lv:7,name:'传奇拉屎侠',need:960},{lv:8,name:'究极黄金神',need:1300},
];
function levelInfo(totalXP){
  let cur=LEVELS[0], next=LEVELS[1];
  for(let i=0;i<LEVELS.length;i++){
    if(totalXP>=LEVELS[i].need){ cur=LEVELS[i]; next=LEVELS[i+1]||null; }
  }
  if(!next){
    const extra=Math.floor((totalXP-cur.need)/500)+1;
    const base=LEVELS[LEVELS.length-1];
    cur={lv:base.lv+extra-1,name:base.name,need:base.need+(extra-1)*500};
    next={need:cur.need+500};
  }
  const pct=Math.min(100,Math.round((totalXP-cur.need)/(next.need-cur.need)*100));
  return {cur,next,pct};
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
const BASE_MSGS=['记录一次，经验+10！你的黄金日记又厚了一页 📖','打卡成功，排便记录员经验+10！','又完成了一次生理大业，经验+10！'];
const DUR_MSGS={
 '<1分钟':['闪电侠附体，效率满分，经验+5！','说时迟那时快，经验+5！'],
 '1-3分钟':['稳定发挥，经验+3。'],
 '3-8分钟':['稳扎稳打，经验+5。'],
 '8分钟以上':['史诗级鏖战！经验+10，你可真是厕所里的持久战士 🛡️','蹲久了腿都麻了吧，经验补偿+10，辛苦啦！'],
};
const MOOD_MSGS={
 '轻松愉悦':['举重若轻，经验+5。'],'畅快淋漓':['一泻千里般的畅快，经验+6！'],
 '平平无奇':['平淡也是一种美，经验+2。'],'意犹未尽':['意犹未尽？下次接着来，经验+3。'],
 '有点费力':['越挫越勇！经验补偿+8，打工人不容易 💪'],
 '非常痛苦':['史诗级战役，经验+15！你可真是拉屎界最坚韧的战士，鼓励一下自己吧 🏅'],
};
const TYPE_MSGS_GOOD=['完美形态！经验+5，教科书级别的表现 ✨'];
const TYPE_MSGS_OK=['每一次记录都值得鼓励，经验+3，身体状态慢慢调整就好。'];
function computeXP(entry,streak){
  let xp=10, msgs=[pick(BASE_MSGS)];
  if(entry.duration){ const p=DUR_MSGS[entry.duration]; if(p){ msgs.push(pick(p)); xp+= entry.duration==='8分钟以上'?10:(entry.duration==='<1分钟'?5:(entry.duration==='3-8分钟'?5:3)); } }
  if(entry.mood){ const p=MOOD_MSGS[entry.mood]; if(p){ msgs.push(pick(p)); xp+= entry.mood==='非常痛苦'?15:(entry.mood==='有点费力'?8:(entry.mood==='畅快淋漓'?6:(entry.mood==='轻松愉悦'?5:(entry.mood==='意犹未尽'?3:2)))); } }
  if(entry.type===3||entry.type===4){ msgs.push(pick(TYPE_MSGS_GOOD)); xp+=5; } else { msgs.push(pick(TYPE_MSGS_OK)); xp+=3; }
  if(streak>=2){ const bonus=Math.min(streak*2,20); xp+=bonus; msgs.push(`连续打卡 ${streak} 天，连击经验+${bonus}！`); }
  return {xp,msgs};
}
function showToast(title,msgs){
  const t=document.getElementById('toast');
  document.getElementById('toastTtl').textContent=title;
  document.getElementById('toastMsg').innerHTML=msgs.map(m=>`• ${m}`).join('<br>');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3600);
}

document.getElementById('btnSave').onclick=()=>{
  if(!sel.type){ alert('至少选一下形状吧 💩'); return; }
  const list=loadData();
  const daysSetPre=new Set(list.map(e=>new Date(e.time).toDateString()));
  let streak=0, cursor=new Date();
  cursor.setDate(cursor.getDate()-1);
  while(daysSetPre.has(cursor.toDateString())){ streak++; cursor.setDate(cursor.getDate()-1); }
  const entry={...sel, time:Date.now()};
  const {xp,msgs}=computeXP(entry,streak+1);
  entry.xp=xp; entry.xpMsgs=msgs;
  list.push(entry); saveData(list);
  document.querySelectorAll('.opt.sel').forEach(o=>o.classList.remove('sel'));
  sel={type:null,color:null,size:null,smell:null,mood:null,duration:null,place:null};
  showToast(`🎉 打卡成功！经验 +${xp}`,msgs);
  render();
};

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-'+btn.dataset.p).classList.add('active');
    render();
  };
});

function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function timeBucket(h){ if(h>=5&&h<9) return '清晨'; if(h>=9&&h<12) return '上午'; if(h>=12&&h<18) return '下午'; if(h>=18&&h<23) return '夜晚'; return '深夜'; }
const TIME_COLORS={'清晨':'#e0a860','上午':'#c8873a','下午':'#7a9a6b','夜晚':'#5a7ab0','深夜':'#4a3f66'};

function donut(elId,legendId,data){
  const total=data.reduce((s,d)=>s+d.count,0)||1;
  let acc=0, stops=[];
  data.forEach(d=>{ const start=acc/total*360; acc+=d.count; const end=acc/total*360; stops.push(`${d.color} ${start}deg ${end}deg`); });
  document.getElementById(elId).style.background = total<=1&&data.every(d=>d.count===0) ? 'var(--line)' : `conic-gradient(${stops.join(',')})`;
  document.getElementById(legendId).innerHTML = data.map(d=>`<div class="legend-row"><span class="legend-dot" style="background:${d.color}"></span><span>${d.label} · ${d.count}${d.count?` (${Math.round(d.count/total*100)}%)`:''}</span></div>`).join('');
}

let calDate=new Date();
function renderCalendar(list){
  document.getElementById('calTitle').textContent=`${calDate.getFullYear()}年${calDate.getMonth()+1}月`;
  const y=calDate.getFullYear(), m=calDate.getMonth();
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const counts={};
  list.forEach(e=>{ const d=new Date(e.time); if(d.getFullYear()===y&&d.getMonth()===m){ counts[d.getDate()]=(counts[d.getDate()]||0)+1; } });
  const wdNames=['日','一','二','三','四','五','六'];
  let html=wdNames.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<firstDay;i++) html+='<div></div>';
  const today=new Date();
  for(let d=1; d<=daysInMonth; d++){
    const c=counts[d]||0;
    let cls='cal-day'; if(c===1) cls+=' has1'; else if(c===2) cls+=' has2'; else if(c>=3) cls+=' has3';
    if(y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate()) cls+=' today';
    html+=`<div class="${cls}" title="${c}次">${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
}
document.getElementById('calPrev').onclick=()=>{ calDate.setMonth(calDate.getMonth()-1); renderCalendar(loadData()); };
document.getElementById('calNext').onclick=()=>{ calDate.setMonth(calDate.getMonth()+1); renderCalendar(loadData()); };

function render(){
  const list=loadData().sort((a,b)=>b.time-a.time);
  const totalXP=list.reduce((s,e)=>s+(e.xp||0),0);
  const {cur,next,pct}=levelInfo(totalXP);
  document.getElementById('lvName').textContent=`Lv.${cur.lv} ${cur.name}`;
  document.getElementById('lvXP').textContent=`${totalXP} XP`;
  document.getElementById('xpFill').style.width=pct+'%';
  document.getElementById('xpNext').textContent=`还需 ${next.need-totalXP} XP 升级`;

  const hEl=document.getElementById('historyList');
  if(list.length===0){ hEl.innerHTML='<div class="empty">还没有记录，快去打卡吧 💩</div>'; }
  else{
    hEl.innerHTML=list.map((e,i)=>{
      const t=TYPES.find(t=>t.id===e.type);
      return `<div class="entry"><div>
        <div>${t?t.ic:''} ${t?t.name:''} · ${e.color||''} ${e.size||''} · <b style="color:var(--gold)">+${e.xp||0}XP</b></div>
        <div class="meta">${fmtDate(e.time)} · ${e.mood||''} · ${e.duration||''} · ${e.place||''}</div>
      </div><button class="del" data-idx="${list.length-1-i}">✕</button></div>`;
    }).join('');
    hEl.querySelectorAll('.del').forEach(b=>{ b.onclick=()=>{ const all=loadData(); all.splice(parseInt(b.dataset.idx),1); saveData(all); render(); }; });
  }

  const now=Date.now(), weekAgo=now-7*86400000;
  const recent7=list.filter(e=>e.time>=weekAgo);
  document.getElementById('statWeek').textContent=recent7.length;
  document.getElementById('statTotal').textContent=list.length;
  const daysSet=new Set(list.map(e=>new Date(e.time).toDateString()));
  let streak=0, cursor=new Date();
  while(daysSet.has(cursor.toDateString())){ streak++; cursor.setDate(cursor.getDate()-1); }
  document.getElementById('statStreak').textContent=streak;

  donut('typeDonut','typeLegend', TYPES.map(t=>({label:t.ic+' '+t.name,count:list.filter(e=>e.type===t.id).length,color:t.color})));

  const buckets=['清晨','上午','下午','夜晚','深夜'];
  const timeData=buckets.map(b=>({label:b,count:list.filter(e=>timeBucket(new Date(e.time).getHours())===b).length,color:TIME_COLORS[b]}));
  donut('timeDonut','timeLegend',timeData);
  const topBucket=timeData.reduce((a,b)=>b.count>a.count?b:a,timeData[0]);
  document.getElementById('timeSummary').innerHTML = list.length ? `你最常在 <b>${topBucket.label}</b> 报到，专属称号：<b>「黄金${topBucket.label}使者」</b> 🌟` : '';

  const maxMood=Math.max(1,...MOODS.map(m=>list.filter(e=>e.mood===m.id).length));
  document.getElementById('moodBubbles').innerHTML=MOODS.map(m=>{
    const c=list.filter(e=>e.mood===m.id).length;
    const size=34+Math.round((c/maxMood)*46);
    return `<div class="bubble" style="width:${size}px;height:${size}px;font-size:${14+size*0.25}px">${m.ic}<b>${c}</b></div>`;
  }).join('');

  renderCalendar(list);

  const analysisBox=document.getElementById('analysisBox');
  if(list.length===0){ analysisBox.textContent='暂无数据，快去打卡吧～'; }
  else{
    let msgs=[];
    const n=recent7.length;
    if(n===0) msgs.push('最近7天<b>还没有记录</b>，记得按时"上班"哦。');
    else if(n<3) msgs.push(`最近7天只记录了<b>${n}次</b>，频率偏低，注意多喝水、多吃膳食纤维。`);
    else if(n>21) msgs.push(`最近7天记录了<b>${n}次</b>，频率偏高，如伴随不适建议关注饮食。`);
    else msgs.push(`最近7天记录<b>${n}次</b>，频率在健康区间内（每周3~21次）。`);
    const hard=recent7.filter(e=>e.type===1||e.type===2).length;
    const loose=recent7.filter(e=>e.type===6||e.type===7).length;
    const good=recent7.filter(e=>e.type===3||e.type===4).length;
    if(n>0){
      if(hard/n>0.5) msgs.push('最近<b>偏硬型</b>占比较高，可能轻度便秘，建议增加水分与蔬果摄入。');
      else if(loose/n>0.5) msgs.push('最近<b>偏稀型</b>占比较高，注意饮食卫生，持续请留意身体状况。');
      else if(good/n>=0.5) msgs.push('大部分记录都在<b>理想形态</b>，消化系统状态不错 👍');
    }
    const painMood=recent7.filter(e=>e.mood==='非常痛苦'||e.mood==='有点费力').length;
    if(painMood>=3) msgs.push('最近"费力/痛苦"记录较多，注意别太紧张，放松心态更顺畅。');
    analysisBox.innerHTML=msgs.map(m=>`<div style="margin-bottom:6px">• ${m}</div>`).join('');
  }

  const badgeEl=document.getElementById('badges');
  const badges=[];
  if(list.length>=1) badges.push('🎉 初次打卡');
  if(list.length>=10) badges.push('📈 十次达成');
  if(list.length>=50) badges.push('🏆 五十次老手');
  if(list.length>=100) badges.push('👑 百次大师');
  if(streak>=3) badges.push('🔥 连续3天');
  if(streak>=7) badges.push('🔥🔥 连续一周');
  if(streak>=30) badges.push('🔥🔥🔥 连续一月');
  if(list.filter(e=>e.type===4).length>=5) badges.push('✨ 完美形态达人');
  if(list.filter(e=>e.mood==='非常痛苦').length>=3) badges.push('🛡️ 坚韧战士');
  badgeEl.innerHTML = badges.length ? badges.map(b=>`<span class="badge">${b}</span>`).join('') : '<span style="color:var(--sub);font-size:13px">继续打卡解锁成就～</span>';
}
render();
</script>
</body>
</html>
