<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>植物生长 demo</title>
<style>
:root{--bg:#e6eee4;--ink:#1f3326;--soft:#5d7565;--btn:#2f5a3c;--btnt:#f2f7ef;--leaf2:#a3c45a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--ink:#dce8d8;--soft:#8fa795;--btn:#a9cf86;--btnt:#14201a;--leaf2:#c2de72}}
:root[data-theme="dark"]{--bg:#14201a;--ink:#dce8d8;--soft:#8fa795;--btn:#a9cf86;--btnt:#14201a;--leaf2:#c2de72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
main{width:100%;max-width:420px;padding:20px 20px 32px;box-sizing:border-box}
h1{font-size:20px;margin:8px 0 2px;font-weight:600}
p.sub{margin:0 0 8px;color:var(--soft);font-size:14px}
.stage{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 4px}
.stage b{font-size:18px}
.stage span{color:var(--soft);font-size:14px}
input[type=range]{width:100%;accent-color:var(--btn);margin:8px 0 14px}
.row{display:flex;gap:10px;margin-bottom:10px}
select{flex:1;font:inherit;font-size:15px;padding:11px 6px;border-radius:10px;border:1.5px solid var(--btn);background:var(--bg);color:var(--ink)}
button{flex:1;font:inherit;font-size:15px;padding:11px 0;border-radius:10px;border:1.5px solid var(--btn);background:transparent;color:var(--ink);cursor:pointer}
button.on{background:var(--btn);color:var(--btnt)}
button:focus-visible,input:focus-visible{outline:3px solid var(--leaf2);outline-offset:2px}
.fld{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--soft)}
.fld input{font:inherit;font-size:15px;padding:9px 6px;border-radius:10px;border:1.5px solid var(--btn);background:var(--bg);color:var(--ink);min-width:0}
.mh{font-size:16px;margin:22px 0 8px;font-weight:600}
.note{margin-top:14px;font-size:13px;color:var(--soft);line-height:1.6;min-height:42px}
.plantart{--stem:#4a6b3a;--wood:#8a6a4a;--leaf1:#6f9f4a;--leaf2:#a3c45a;--leafd:#4c7d38;--bloomc:#e9b44c;--potd:#a9bda6;--potl:#dbe7d7;--soil:#7a5c43;--pot:#c9d8c5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .plantart{--stem:#7fa062;--wood:#a8845c;--leaf1:#8fbf5f;--leaf2:#c2de72;--leafd:#5f9546;--potd:#1a291f;--potl:#33503d;--soil:#6b5039;--pot:#223328}}
:root[data-theme="dark"] .plantart{--stem:#7fa062;--wood:#a8845c;--leaf1:#8fbf5f;--leaf2:#c2de72;--leafd:#5f9546;--potd:#1a291f;--potl:#33503d;--soil:#6b5039;--pot:#223328}
.plantart svg{width:100%;height:auto;display:block;transition:filter .6s ease}
.pa-sway{transform-origin:150px 267.8px;animation:pa-sway 5s ease-in-out infinite alternate}
.plantart.dormant .pa-sway{animation:none}
.plantart.dormant svg{filter:saturate(.35) brightness(.95)}
@keyframes pa-sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
@media (prefers-reduced-motion:reduce){.pa-sway{animation:none}}

</style>
</head>
<body>
<main id="app">
  <h1>此事有记 · 植物 demo</h1>
  <p class="sub">全部由代码生成，没有任何图片素材；生长只由施肥养分决定</p>
  <div class="plantart" id="pa"><svg id="s" viewBox="0 0 300 320" role="img" aria-label="随养分生长的植物"></svg></div>
  <div class="stage"><b id="st"></b><span id="dv"></span></div>
  <input id="r" type="range" min="0" max="2200" step="5" value="900" aria-label="累计养分">
  <div class="row">
    <select id="sp" aria-label="品种"><option value="sakura">樱花</option><option value="rose">月季</option><option value="cosmos">波斯菊</option></select>
  </div>
  <div class="row">
    <label class="fld">种子日期<input type="date" id="sd" aria-label="种子日期"></label>
    <label class="fld">种子时刻<input type="time" id="stm" aria-label="种子时刻"></label>
  </div>
  <div class="row">
    <button id="ck">施肥 +10</button>
    <button id="dor" aria-pressed="false">模拟休眠</button>
  </div>
  <div class="note" id="nt"></div>
  <h2 class="mh">博物馆 · 换代后移栽的老植物</h2>
  <div class="row"><select id="mo" aria-label="预览月份"></select></div>
  <div class="plantart" id="mu"></div>
  <div class="note" id="mn"></div>
</main>
<script>
/* ===== PlantArt：纯代码生成的 SVG 植物。new PlantArt(svgElement)
   生长进度 prog∈[0,1] 完全由施肥累计的养分决定（PlantArt.prog(养分)），与天数无关 ===== */
function paHash(x){x=x>>>0;x^=x>>>16;x=Math.imul(x,0x85ebca6b);x^=x>>>13;x=Math.imul(x,0xc2b2ae35);x^=x>>>16;return x>>>0;}
/* 种子 = f(时刻, 日期)：x=一天中的第几分钟，y=第几天。两个变量各自先散列再混合——
   只要时刻不同或日期不同，种子就不同、长出来的植物不同；时刻和日期都相同（精确到分钟）才会一样 */
function plantSeedFromTime(ms){
  var d=new Date(ms),min=d.getHours()*60+d.getMinutes(),day=Math.floor((ms-d.getTimezoneOffset()*60000)/86400000);
  var hx=paHash(Math.imul(min+1,2654435761)),hy=paHash(Math.imul(day,40503)^0x5bd1e995);
  return ((hx^Math.imul(hy,0x27d4eb2d))>>>0)||1;
}
function PlantArt(svg){
var seed=7,D=4,tree,S,cur=0,raf=0,T0=performance.now(),dk=false,ID='';
var PI=Math.PI;
/* 品种：参数决定生长姿态（分枝角度、主干优势、向上程度）和花形。
   wd=木质化程度（樱花木本、月季半木本、波斯菊草本几乎不变棕）；pl/dr/pw=花梗长度范围/下垂程度/粗细 */
var SP={
sakura:{k:'sakura',D:4,rl:58,rw:6,r:.74,sr:.58,sc:[6,14],ss:[26,40],bend:.08,pull:.15,pk:.7,nl:3,la:[40,60],ls:1,lw:.5,fp:.3,fs:1,bt:[22,52],wd:1,pl:[12,17],dr:.75,pw:.9,
 pal:[{l:'#f6d3d8',m:'#efb3c0',d:'#dd8499'},{l:'#fbf3f4',m:'#f4dfe3',d:'#e3a9b6'},{l:'#f0a8bc',m:'#e48aa4',d:'#cc5478'},{l:'#ecd0e6',m:'#dcb0d2',d:'#b878ac'}],c:null},
rose:{k:'rose',D:3,rl:72,rw:5,r:.82,sr:.62,sc:[3,9],ss:[22,34],bend:.06,pull:.25,pk:.5,nl:3,la:[45,65],ls:1.15,lw:.6,fp:.35,fs:1.3,bt:[28,58],wd:.75,pl:[14,19],dr:0,pw:1.8,
 pal:[{l:'#e8607a',m:'#d03a5a',d:'#9c1f3d'},{l:'#f6b8c4',m:'#ee93a6',d:'#d0546f'},{l:'#f8e08a',m:'#f0c850',d:'#d49a1e'},{l:'#fdf6f0',m:'#f2e0d8',d:'#d9a898'},{l:'#f9b08c',m:'#f08a64',d:'#d0583a'}],c:{'--bloomc':'#e9b44c'}},
cosmos:{k:'cosmos',D:3,rl:66,rw:3.4,r:.8,sr:.64,sc:[3,8],ss:[24,38],bend:.08,pull:.3,pk:.55,nl:4,la:[50,75],ls:1,lw:.16,fp:.3,fs:1.1,bt:[62,82],wd:.12,pl:[15,21],dr:.12,pw:1.2,
 pal:[{l:'#f9c7de',m:'#ee8fba',d:'#c2428a'},{l:'#ffffff',m:'#f3e8f0',d:'#d6a4c4'},{l:'#fbc97a',m:'#f5a03c',d:'#d8701a'},{l:'#e86aa8',m:'#cf3f86',d:'#9c1f62'}],c:{'--bloomc':'#f0b730'}}};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var f1=function(v){return v.toFixed(1)};
function isDark(){var h=document.documentElement.getAttribute('data-theme');return h==='dark'||(h!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
/* 深色模式下花色压暗一点、略降饱和（固定十六进制不会跟 CSS 变量走，所以在生成渐变时处理） */
function tone(hex){
  if(!dk)return hex;
  var n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,l=.299*r+.587*g+.114*b;
  function m(c){return Math.round(clamp(c*.8+l*.1,0,255))}
  return '#'+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1);
}
/* 养分 → 生长进度。锚点对齐 app 的阶段门槛：80 破土、220 抽枝、450 长叶、800 开始分化花苞、1300、2200 满开 */
var MAP=[[0,0],[80,.02],[220,.17],[450,.43],[800,.75],[1300,.9],[2200,1]],SEED=.012;
function progOf(n){
  if(!(n>0))return 0;if(n>=MAP[MAP.length-1][0])return 1;
  for(var i=1;i<MAP.length;i++)if(n<=MAP[i][0]){var a=MAP[i-1],b=MAP[i];return a[1]+(b[1]-a[1])*(n-a[0])/(b[0]-a[0]);}
  return 1;
}
function useSp(k,sd){
  S=SP[k];if(sd)seed=sd;
  svg.style.removeProperty('--bloomc');
  if(S.c)for(var v in S.c)svg.style.setProperty(v,S.c[v]);
  tree=build(seed);
}

/* 整株植物的形状只在这里生成一次，之后天数变化只改变"长到哪一步" */
function build(sd){
  var R=rng(sd),terms=[],rr=function(a){return a[0]+(a[1]-a[0])*R()};
  D=S.D;
  /* 主干优势：续生枝只小角度偏离并被拉向竖直，侧枝反向、更大角度、更短更细；弯曲很小，不是藤蔓 */
  function mk(a,len,w,d){
    var n={a:a,len:len,w:w,d:d,bend:(R()-.5)*2*S.bend,leaves:[],kids:[],tip:null,fls:null};
    var nl=d===0?S.nl:2;
    for(var i=0;i<nl;i++)n.leaves.push({t:.25+.45*R(),side:i%2?1:-1,ang:S.la[0]+R()*(S.la[1]-S.la[0]),s:(7+R()*3)*S.ls*(1.1-d*.1),tone:R()>.5});
    if(d<D){
      var two=R()<S.pk,sg=R()>.5?1:-1,ca=a+sg*rr(S.sc),sa=a-sg*rr(S.ss);
      ca+=(-90-ca)*S.pull;sa+=(-90-sa)*S.pull;
      n.kids.push(mk(ca,len*S.r*(.95+.1*R()),w*.68,d+1));
      if(two){var sk=mk(sa,len*S.sr*(.95+.1*R()),w*.5,d+1);sk.side=true;n.kids.push(sk);}
    }else{n.tip={ang:(R()-.5)*30,s:10,tone:R()>.5};terms.push(n);}
    return n;
  }
  var root=mk(-90,S.rl,S.rw,0),fl=[],N=0;
  terms.forEach(function(n){if(R()>S.fp)fl.push(n)});
  if(!fl.length)fl.push(terms[0]);
  /* 每个开花的枝梢带一簇花：樱花 1–3 朵、短花梗、略微下垂；月季/波斯菊单朵长花梗。
     每朵花有自己的开始时间、朝向、大小和盛开形态 */
  fl.forEach(function(n,i){
    var k=S.k==='sakura'?1+(R()<.8?1:0)+(R()<.35?1:0):1,base=.81+.07*(i/Math.max(1,fl.length-1));
    n.fls=[];
    for(var j=0;j<k;j++){
      var f={s:base+j*.01+R()*.01,r:R()*360,v:(i+j+Math.floor(R()*3))%3,b:rr(S.bt),c:Math.floor(R()*S.pal.length),sc:(.88+R()*.26)*(k>1?.86:1)};
      var off=S.k==='sakura'?(k===1?(R()-.5)*30:-50+100*(j/(k-1))+(R()-.5)*16):(R()-.5)*10;
      n.fls.push({f:f,p:{off:off,len:rr(S.pl),dr:S.dr}});
      N++;
    }
  });
  return {root:root,N:N};
}

/* 叶子：沿一条微弯的叶轴生成叶形（基部尖、最宽处偏下、尖端渐收），cu 为尖端下垂量。
   中脉是从基部向叶尖渐细的实心形，侧脉是极细的弧线，不再是一根等粗的线 */
function leaf(arr,x,y,a,s,tone,cu){
  if(s<1.2)return;
  var L=s*1.9,w=s*S.lw*.8,c=(cu||0)*L,N=10,A=[],B=[],ax=[],ay=[],nx=[],ny=[],hw=[],i,t,tx,ty,m,k;
  for(i=0;i<=N;i++){
    t=i/N;ax[i]=c*t*t;ay[i]=-L*t;tx=2*c*t;ty=-L;m=Math.sqrt(tx*tx+ty*ty);
    nx[i]=-ty/m;ny[i]=tx/m;
    hw[i]=w*(t<.42?Math.sin(Math.PI/2*Math.pow(t/.42,1.35)):Math.cos(Math.PI/2*Math.pow((t-.42)/.58,.95)));
    A.push(f1(ax[i]+nx[i]*hw[i]*1.05)+' '+f1(ay[i]+ny[i]*hw[i]*1.05));
    B.push(f1(ax[i]-nx[i]*hw[i]*.95)+' '+f1(ay[i]-ny[i]*hw[i]*.95));
  }
  var col=tone?'var(--leaf1)':'var(--leaf2)',o='<g transform="translate('+f1(x)+' '+f1(y)+')rotate('+(a+90).toFixed(0)+')">';
  o+='<path d="M'+A.join('L')+'L'+B.slice().reverse().join('L')+'Z" fill="'+col+'"/>';
  /* 背光一侧略深，基部略深：用半片叶形叠色，而不是整片一刀切 */
  var H=[];for(i=0;i<=N;i++)H.push(f1(ax[i])+' '+f1(ay[i]));
  o+='<path d="M'+B.join('L')+'L'+H.slice().reverse().join('L')+'Z" fill="var(--leafd)" opacity=".2"/>';
  var M1=[],M2=[];
  for(i=0;i<=N-1;i++){var mw=.06+.4*Math.pow(1-i/N,1.2)*Math.min(1,w/3);M1.push(f1(ax[i]+nx[i]*mw)+' '+f1(ay[i]+ny[i]*mw));M2.push(f1(ax[i]-nx[i]*mw)+' '+f1(ay[i]-ny[i]*mw));}
  o+='<path d="M'+M1.join('L')+'L'+M2.reverse().join('L')+'Z" fill="var(--leafd)" opacity=".5"/>';
  if(w>=2.2){
    var sv='';
    [3,5,7].forEach(function(ki){
      [1,-1].forEach(function(sd){
        var ei=Math.min(N-1,ki+2),ex=ax[ei]+sd*nx[ei]*hw[ei]*.72,ey=ay[ei]+sd*ny[ei]*hw[ei]*.72;
        var cx=ax[ki+1]+sd*nx[ki+1]*hw[ki+1]*.6,cy=ay[ki+1]+sd*ny[ki+1]*hw[ki+1]*.6;
        sv+='M'+f1(ax[ki])+' '+f1(ay[ki])+'Q'+f1(cx)+' '+f1(cy)+' '+f1(ex)+' '+f1(ey);
      });
    });
    o+='<path d="'+sv+'" stroke="var(--leafd)" stroke-width=".28" stroke-opacity=".3" fill="none" stroke-linecap="round"/>';
  }
  arr.push(o+'</g>');
}

/* 花瓣：顶端有浅缺口，底部颜色深、向外变浅，带中脉和两条侧脉 */
function petal(h,w,fill,rot,dc){
  var d='M0 0C'+(-w*.9)+' '+(-h*.25)+' '+(-w*.8)+' '+(-h*.88)+' '+(-w*.2)+' '+(-h)+'Q0 '+(-h*.9)+' '+(w*.2)+' '+(-h)+'C'+(w*.8)+' '+(-h*.88)+' '+(w*.9)+' '+(-h*.25)+' 0 0Z';
  var v='<path d="M0 -.5L0 '+(-h*.78)+'M0 '+(-h*.25)+'L'+(-w*.42)+' '+(-h*.6)+'M0 '+(-h*.25)+'L'+(w*.42)+' '+(-h*.6)+'" stroke="'+dc+'" stroke-opacity=".4" stroke-width=".35" fill="none" stroke-linecap="round"/>';
  return '<g transform="rotate('+rot+')"><path d="'+d+'" fill="url(#'+fill+')" stroke="'+dc+'" stroke-opacity=".35" stroke-width=".4"/>'+v+'</g>';
}
/* 萼片：披针形，和花瓣一样按三维方向投影，所以花苞时萼片与花苞等比例、同样被花的倾角压短 */
function sepalPath(L){var w=L*.3;return '<path d="M0 0C'+(-w)+' '+(-L*.25)+' '+(-w*.8)+' '+(-L*.7)+' 0 '+(-L)+'C'+(w*.8)+' '+(-L*.7)+' '+w+' '+(-L*.25)+' 0 0Z" fill="var(--leafd)"/>';}
/* 花：每片花瓣按三维方向投影到屏幕。o 为开放程度 0→1，花瓣从并拢的花苞逐渐张开；
   f.b 是花轴朝向观众的倾角（樱花、月季侧着开，波斯菊近乎正对），f.r 绕花轴随机转动。
   花瓣宽度按其宽度方向在屏幕上的投影收窄（透视）。
   bs=花苞长大比例(0.35→1)，pk=花瓣露出比例(小时花瓣藏在萼片里，只见绿色花苞) */
function bloom(f,o,bs,pk){
  var items=[],v=f.v,key=S.k,pc=S.pal[f.c],b=f.b*PI/180,cb=Math.cos(b),sb=Math.sin(b);
  var e=o*o*(3-2*o),sz=(.5+.5*Math.min(1,o*1.6))*bs,wf=.6+.4*e;
  function dir(t,ph){var st=Math.sin(t),ct=Math.cos(t);return [st*Math.cos(ph),ct*cb-st*Math.sin(ph)*sb,ct*sb+st*Math.sin(ph)*cb];}
  function ring(n,h,w,fill,off,tm){
    for(var j=0;j<n;j++){
      var ph=(off+j*360/n+f.r)*PI/180,d=dir(tm*PI/180*e,ph),l2=Math.sqrt(d[0]*d[0]+d[1]*d[1]),len=Math.max(l2,.3);
      var ws=1;
      if(l2>.08){var u0=d[0]/l2,u1=d[1]/l2;ws=.45+.55*Math.min(1,Math.abs(-Math.sin(ph)*u1+Math.cos(ph)*sb*u0));}
      items.push([d[2],'<g transform="rotate('+f1(Math.atan2(d[0],d[1])*180/PI)+')scale(1 '+f1(len)+')">'+petal(h*sz*pk,w*sz*wf*ws*Math.max(.7,pk),ID+fill+f.c,0,tone(pc.d))+'</g>']);
    }
  }
  function stam(n,r0,dr){
    if(o<.4)return;
    var k=clamp((o-.4)/.4,0,1);
    for(var j=0;j<n;j++){
      var L=(r0+(j%2)*dr)*k,d=dir(.3+.12*(j%2),(j*360/n+f.r)*PI/180),px=d[0]*L,py=-d[1]*L;
      items.push([d[2]+.3,'<path d="M0 0L'+f1(px)+' '+f1(py)+'" stroke="'+tone(pc.d)+'" stroke-opacity=".6" stroke-width=".35"/><circle cx="'+f1(px)+'" cy="'+f1(py)+'" r=".85" fill="var(--bloomc)"/>']);
    }
  }
  /* 花托 + 4 枚萼片：花苞时贴紧包住花瓣（倾角 10°），开花时向外翻下去（倾角 105°），长度也随之缩短 */
  items.push([-9,'<ellipse rx="'+f1(2.5*bs)+'" ry="'+f1(2.9*bs)+'" fill="var(--leafd)"/>']);
  var sl=(5.6-1.2*e)*bs,stl=(10+95*e)*PI/180;
  for(var q=0;q<4;q++){
    var sph=(f.r+45+q*90)*PI/180,sd=dir(stl,sph),sl2=Math.max(Math.sqrt(sd[0]*sd[0]+sd[1]*sd[1]),.3);
    items.push([sd[2]-.15,'<g transform="rotate('+f1(Math.atan2(sd[0],sd[1])*180/PI)+')scale(1 '+f1(sl2)+')">'+sepalPath(sl)+'</g>']);
  }
  if(key==='sakura'){
    if(v===0){ring(5,12.4,5,'petalb',36,86);ring(5,11,4.6,'petal',0,78);stam(9,5,1.5);}
    else if(v===1){ring(5,13,5.2,'petalb',36,88);ring(5,12,5,'petal',0,80);ring(5,8.4,3.8,'petal',36,64);stam(6,4,1);}
    else{ring(5,12.6,5.8,'petalb',36,92);ring(5,11.4,5.4,'petal',0,84);stam(7,6,1.8);}
  }else if(key==='rose'){

    else if(v===1){ring(5,13,6.4,'petalb',0,92);ring(5,11,5.6,'petal',36,70);ring(4,8,4.4,'petal',20,40);stam(8,3.5,1);}
    else{ring(5,10,5.2,'petalb',0,80);ring(5,8,4.6,'petal',36,62);ring(4,5.6,3.6,'petal',18,35);ring(3,3.4,2.6,'petal',0,15);}
  }else{
    if(v===0)ring(8,13,4.8,'petalb',22,90);
    else if(v===1){ring(8,13,4.6,'petalb',0,90);ring(8,11,4.2,'petal',22.5,86);}
    else ring(6,12,6,'petalb',0,90);
    if(o>.5)items.push([5,'<circle r="'+f1(3.4*e)+'" fill="var(--bloomc)"/><circle r="'+f1(1.8*e)+'" fill="#c98a1c"/>']);

}
/* 每朵花的时间线（prog 单位）：s-0.05 起花梗抽出、花苞由小变大(绿)；s-0.03 起花瓣在萼片里露出颜色；s 起开放 */
function fpg(f,g){return clamp((g-(f.s-.05))/.03,0,1);}
function flower(arr,x,y,a,f,g){
  var t=(g-f.s)/.09,o=clamp(t/.85,0,1),pg=fpg(f,g),bs=t<0?.35+.65*pg:1,pk=t<0?.12+.88*clamp((g-(f.s-.03))/.03,0,1):1;
  var stg=t<0?(pk<.5?0:1):o<1?2:4;
  var h='<g transform="translate('+f1(x)+' '+f1(y)+')rotate('+(a+90).toFixed(0)+')scale('+f1(S.fs*f.sc)+')">'+bloom(f,o,bs,pk);
  arr.push(h+'</g>');
  return stg;
}
/* 花梗：从枝梢出发的一小段曲线，樱花向下垂（末端朝向往水平/下方转），月季、波斯菊基本挺直 */
function ped(x,y,ang,p,pg){
  var L=p.len*pg,a0=ang+p.off,c0=Math.cos(a0*PI/180),side=Math.abs(c0)<.05?(p.off>=0?1:-1):(c0>=0?1:-1);
  var a1=a0+side*p.dr*70,r0=a0*PI/180,r1=a1*PI/180;
  var cx=x+Math.cos(r0)*L*.55,cy=y+Math.sin(r0)*L*.55,ex=cx+Math.cos(r1)*L*.5,ey=cy+Math.sin(r1)*L*.5;
  return {x:ex,y:ey,a:a1,d:'M'+f1(x)+' '+f1(y)+'Q'+f1(cx)+' '+f1(cy)+' '+f1(ex)+' '+f1(ey)};
}

function stageName(prog,cnt,N){
  if(prog<SEED)return '一颗种子';
  if(prog<.1)return '发芽';
  if(prog<.35)return '长叶';
  if(cnt[4]===N)return '盛开';
  if(cnt[2]+cnt[3]+cnt[4]>0)return '开花';
  if(cnt[1]>0)return '结花苞';
  return '分枝';
}

/* prog∈[0,1]，可以是小数（生长过渡中间帧）。返回 {name,cnt,N} */
function draw(prog){var r=render(prog,{});svg.innerHTML=r.html;return r.info;}
/* o.frag=只生成植物（无盆无土，供博物馆大花盆使用）；o.idp=id 前缀；o.season={open,alpha}=按季节控制花
   （open 0→1 对应花苞萌发→盛开，alpha 是花的整体不透明度，花谢时淡出） */
function render(prog,o){
  o=o||{};ID=o.idp||'';dk=isDark();
  var season=o.season||null,al=season?clamp(season.alpha,0,1):1,showF=al>.02;
  var g=prog,gF=season?.70+.30*season.open:g,gg=Math.min(1,g/.75),sm=[],lv=[],fw=[],wg=[],cnt=[0,0,0,0,0],wn=0;
  var kw=clamp(gg*1.25,0,1)*S.wd;
  function lvl(d){return Math.pow(Math.max(0,1-d/(D+.5)),1.4)*kw;}
  var sm0=[],trunkDD='';
  /* 叶柄：从茎的中心线出发的变细小多边形（根部粗、叶端细），画在茎的下面，从茎的边缘"长出来"，
     没有贴在茎面上的圆点或接缝 */
  function petPoly(bx,by,kx,ky,lx,ly,w0,w1,wa){
    var Lp=[],Rp=[],i,t,u,px,py,tx,ty,m,h;
    for(i=0;i<=8;i++){
      t=i/8;u=1-t;
      px=u*u*bx+2*u*t*kx+t*t*lx;py=u*u*by+2*u*t*ky+t*t*ly;
      tx=2*u*(kx-bx)+2*t*(lx-kx);ty=2*u*(ky-by)+2*t*(ly-ky);m=Math.sqrt(tx*tx+ty*ty)||1;
      h=(w0+(w1-w0)*t)/2;
      Lp.push(f1(px-ty/m*h)+' '+f1(py+tx/m*h));Rp.push(f1(px+ty/m*h)+' '+f1(py-tx/m*h));
    }
    var d='M'+Lp.join('L')+'L'+Rp.reverse().join('L')+'Z',o='<path d="'+d+'" fill="var(--stem)"/>';
    /* 叶柄根部带茎的木色（浓度 wa），往叶片方向渐变成绿色，所以枝→柄→叶的颜色是连续过渡 */
    if(wa>.04){
      var id=ID+'pa-p'+(wn++);
      wg.push('<linearGradient id="'+id+'" gradientUnits="userSpaceOnUse" x1="'+f1(bx)+'" y1="'+f1(by)+'" x2="'+f1(lx)+'" y2="'+f1(ly)+'"><stop offset="0" style="stop-color:var(--wood);stop-opacity:'+wa.toFixed(2)+'"/><stop offset=".85" style="stop-color:var(--wood);stop-opacity:0"/></linearGradient>');
      o+='<path d="'+d+'" fill="url(#'+id+')"/>';
    }
    return o;
  }
  /* out=本枝（及其子枝）的线稿画到哪一层；ov=起点沿切线回退的长度，让子枝伸进母枝内部与母枝同色重叠，
     接缝处没有描边、没有横线 */
  function rb(n,x0,y0,ux,uy,wmax,out,ov){
    var p=clamp(gg*(D+1)-n.d,0,1);
    if(p<=0)return;
    ov=ov||0;
    var x=x0-ux*ov,y=y0-uy*ov;
    var L=n.len*p,rad=n.a*PI/180,e=rad+n.bend,dx=Math.cos(rad),dy=Math.sin(rad);
    var ex=x0+Math.cos(e)*L,ey=y0+Math.sin(e)*L;
    L+=ov;
    /* 三次贝塞尔：起点切线=父枝梢方向，终点切线=n.a，枝与枝之间没有折角 */
    var x1=x+ux*L*.45,y1=y+uy*L*.45,x2=ex-dx*L*.4,y2=ey-dy*L*.4;
    function bz(t){var u=1-t;return [
      u*u*u*x+3*u*u*t*x1+3*u*t*t*x2+t*t*t*ex,
      u*u*u*y+3*u*u*t*y1+3*u*t*t*y2+t*t*t*ey,
      3*u*u*(x1-x)+6*u*t*(x2-x1)+3*t*t*(ex-x2),
      3*u*u*(y1-y)+6*u*t*(y2-y1)+3*t*t*(ey-y2)];}
    var hk=n.kids.length>0,bw=Math.min(n.d===0?n.w*(.45+.55*p):n.w,wmax||99),tw=bw*(hk?.3+.38*p:.3),pt=p<1||!hk;
    /* 叶：叶柄先于枝身画（在枝身下面），叶片画在最上层 */
    n.leaves.forEach(function(l){
      var qq=clamp((p-l.t)/.25,0,1);
      if(qq<=0)return;
      var c=bz(l.t),bx=c[0],by=c[1],tb=Math.atan2(c[3],c[2]);
      var la=tb*180/PI+l.side*l.ang,s=l.s*qq,pl=s*.95,r1=la*PI/180;
      var kx=bx+Math.cos(tb+l.side*l.ang*PI/180*.12)*pl*.55,ky=by+Math.sin(tb+l.side*l.ang*PI/180*.12)*pl*.55;
      var lx=kx+Math.cos(r1)*pl*.5,ly=ky+Math.sin(r1)*pl*.5;
      var la2=Math.atan2(ly-ky,lx-kx)*180/PI,w0=Math.max(.5,Math.min(clamp(s*.3,.8,2.3),(bw+(tw-bw)*l.t)*.78));
      out.push(petPoly(bx,by,kx,ky,lx+Math.cos(la2*PI/180)*.9,ly+Math.sin(la2*PI/180)*.9,w0,Math.max(.4,w0*.45),lvl(n.d)+(lvl(n.d+1)-lvl(n.d))*l.t));
      leaf(lv,lx,ly,la2,s,l.tone,.12*(Math.cos(la2*PI/180)>=0?1:-1));
    });
    /* 枝条是上细下粗的锥形：底宽=n.w（子枝底宽恰好等于父枝梢宽，衔接无台阶）；
       还在长、或没有子枝的枝梢收成尖头；长齐且有子枝的枝梢留平口，由子枝接住 */
    var lp=[],rp=[],i,q,t0,h,m,N=12;
    for(i=0;i<=N;i++){
      t0=i/N;q=bz(t0);m=Math.sqrt(q[2]*q[2]+q[3]*q[3])||1;
      h=(bw+(tw-bw)*t0)/2;
      /* 基部膨大：主干根部张开（像从土里长出来），侧枝基部有一圈枝领，和母枝自然过渡 */
      h*=1+(n.d===0?.6:(n.side?.5:0))*Math.pow(Math.max(0,1-t0*L/(n.d===0?9:6)),2);
      if(pt&&t0>.7)h*=Math.pow((1-t0)/.3,.7);

    /* 老嫩分色：同一形状上叠一层木色，不透明度从枝基部到枝梢递减，且层级越深越浅；
       子枝起点的木色浓度等于父枝梢的浓度，所以颜色连续。几何完全不变 */
    var a0=lvl(n.d),a1=lvl(n.d+1);

      var id=ID+'pa-w'+(wn++);
      wg.push('<linearGradient id="'+id+'" gradientUnits="userSpaceOnUse" x1="'+f1(x)+'" y1="'+f1(y)+'" x2="'+f1(ex)+'" y2="'+f1(ey)+'"><stop offset="0" style="stop-color:var(--wood);stop-opacity:'+a0.toFixed(2)+'"/><stop offset="1" style="stop-color:var(--wood);stop-opacity:'+a1.toFixed(2)+'"/></linearGradient>');
      out.push('<path d="'+dd+'" fill="url(#'+id+')"/>');
    }
    if(n.tip&&!n.fls)leaf(lv,ex,ey,n.a+n.tip.ang,n.tip.s*clamp((p-.5)/.5,0,1),n.tip.tone,0);
    if(n.fls&&p>.99)n.fls.forEach(function(it){
      /* 花梗先抽出来，再在梗端开花 */
      var pg=clamp((gF-(it.f.s-.03))/.05,0,1);
      if(pg<=0||!showF)return;
      var pe=ped(ex,ey,n.a,it.p,pg);
      out.push('<path d="'+pe.d+'" fill="none" stroke="var(--stem)" stroke-opacity="'+al.toFixed(2)+'" stroke-width="'+S.pw+'" stroke-linecap="round"/>');
      cnt[flower(fw,pe.x,pe.y,pe.a,it.f,gF)]++;
    });
    var et=Math.sqrt((ex-x2)*(ex-x2)+(ey-y2)*(ey-y2))||1,tipW=bw+(tw-bw)*1,tx=(ex-x2)/et,ty=(ey-y2)/et;
    n.kids.forEach(function(k){
      if(k.side){
        /* 侧枝从母枝 88% 处长出，整棵侧枝画在母枝身下：枝根藏在母枝里，从母枝边缘"长出"，没有平口 */
        var c2=bz(.88),m2=Math.sqrt(c2[2]*c2[2]+c2[3]*c2[3])||1,w88=bw+(tw-bw)*.88;
        rb(k,c2[0],c2[1],c2[2]/m2,c2[3]/m2,w88*.78,sm0,0);
      }else rb(k,ex,ey,tx,ty,tipW,out,.7);
    });
  }
  var pg='';
  S.pal.forEach(function(c,i){pg+='<linearGradient id="'+ID+'petal'+i+'" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="'+tone(c.d)+'"/><stop offset=".5" stop-color="'+tone(c.l)+'"/><stop offset="1" stop-color="'+tone(c.l)+'"/></linearGradient><linearGradient id="'+ID+'petalb'+i+'" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="'+tone(c.d)+'"/><stop offset="1" stop-color="'+tone(c.m)+'"/></linearGradient>'});
  var sz=prog<SEED?0:clamp(.2+gg*.8,0,1);
  var mainBase='<defs>'+pg
   +'<linearGradient id="potg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--potd)"/><stop offset=".3" style="stop-color:var(--pot)"/><stop offset=".62" style="stop-color:var(--pot)"/><stop offset="1" style="stop-color:var(--potd)"/></linearGradient>'
   +'<linearGradient id="potm" gradientUnits="userSpaceOnUse" x1="0" y1="276" x2="0" y2="298"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>'
   +'<linearGradient id="rimsh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>'
   +'<radialGradient id="pacs"><stop offset="0" stop-color="#000" stop-opacity=".42"/><stop offset=".55" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>'
   +'<clipPath id="pasoil"><ellipse cx="150" cy="268.9" rx="51" ry="4.6"/></clipPath>'
   +'<clipPath id="potclip"><path d="M99 278H201L191 312H109Z"/></clipPath>'
   +'<mask id="potmask" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="320"><rect width="300" height="320" fill="url(#potm)"/></mask></defs>'
   +'<g mask="url(#potmask)"><path d="M99 278H201L191 312H109Z" fill="url(#potg)"/>'
   +'<rect x="90" y="278" width="120" height="14" fill="url(#rimsh)" clip-path="url(#potclip)"/>'
   +'<path d="M107 288L113 307" stroke="var(--potl)" stroke-width="3" stroke-linecap="round" fill="none" opacity=".45"/>'
   +'<path d="M93.2 268.5C92.2 268.9 91.8 271 91.8 272.6C91.8 274.5 92.4 275.9 93.6 276.6A56.4 6.2 0 0 0 206.4 276.6C207.6 275.9 208.2 274.5 208.2 272.6C208.2 271 207.8 268.9 206.8 268.5Z" fill="url(#potg)"/>'
   +'<ellipse cx="150" cy="268.5" rx="56.8" ry="6" fill="url(#potg)"/>'
   +'<ellipse cx="150" cy="268.5" rx="56.8" ry="6" fill="var(--potl)" opacity=".4"/>'
   +'<ellipse cx="150" cy="268.3" rx="52" ry="5.4" fill="var(--potd)"/></g>'
   +'<ellipse cx="150" cy="268.9" rx="51" ry="4.6" fill="var(--soil)"/>'
   +'<g fill="#000" opacity=".22"><circle cx="124" cy="268.6" r=".9"/><circle cx="137" cy="270.4" r=".8"/><circle cx="165" cy="270" r=".9"/><circle cx="178" cy="267.8" r=".8"/></g>'
   +'<g fill="#fff" opacity=".16"><circle cx="131" cy="267" r=".8"/><circle cx="158" cy="270.6" r=".7"/><circle cx="171" cy="268.2" r=".8"/></g>'
   /* 土面光影（植物之下）：一片偏右下的柔和投影 + 根部一圈环境暗部。两者都被裁在土面椭圆内，随植株长大而变大 */
   +'<g clip-path="url(#pasoil)"><ellipse cx="'+f1(151+sz*4)+'" cy="269.5" rx="'+f1(8+sz*24)+'" ry="'+f1(1.8+sz*1.9)+'" fill="url(#pacs)" opacity="'+f1(.4+sz*.35)+'"/>'
   +(prog<SEED?'':'<ellipse cx="150" cy="269.2" rx="'+f1(S.rw*.9+7)+'" ry="2.7" fill="url(#pacs)" opacity=".6"/>')
   +'</g>'
   +'<linearGradient id="paocc" gradientUnits="userSpaceOnUse" x1="0" y1="257" x2="0" y2="271.5"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".55" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>';
  var pacsD='<radialGradient id="'+ID+'pacs"><stop offset="0" stop-color="#000" stop-opacity=".42"/><stop offset=".55" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>';
  var paoccD='<linearGradient id="'+ID+'paocc" gradientUnits="userSpaceOnUse" x1="0" y1="257" x2="0" y2="271.5"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".55" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>';
  var fragBase='<defs>'+pg+pacsD+paoccD+'</defs>'+(prog<SEED?'':'<ellipse cx="'+f1(151+sz*5)+'" cy="272" rx="'+f1(10+sz*28)+'" ry="'+f1(2.4+sz*2.4)+'" fill="url(#'+ID+'pacs)" opacity="'+f1(.5+sz*.3)+'"/><ellipse cx="150" cy="272" rx="'+f1(S.rw*.9+7)+'" ry="3" fill="url(#'+ID+'pacs)" opacity=".6"/>');

    rb(tree.root,150,272.2,0,-1,99,sm,0);

    var ph=((((performance.now()-T0)/1000)+(o.phase||0))%10).toFixed(2);
    var occ=trunkDD?'<rect x="110" y="250" width="80" height="24" fill="url(#'+ID+'paocc)" clip-path="url(#'+ID+'pa-tc)"/>':'';

  }

     → 茎根上一层很淡的暗化，只用来衔接，不再是浮在根部上方的一块阴影 */
  if(o.frag){
    var bc=(S.c&&S.c['--bloomc'])||'#e9b44c';

  }
  info.N=tree.N;info.name=stageName(prog,cnt,tree.N);
  return {html:base+body,info:info};
}

/* 生长过渡：把显示的天数从当前值缓动到 target（枝条伸长、花慢慢张开）。reduced-motion 下直接跳到目标 */
function go(target,opt){
  opt=opt||{};cancelAnimationFrame(raf);
  var from=cur,dist=Math.abs(target-from),rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fin(){cur=target;var i=draw(cur);if(opt.onFrame)opt.onFrame(cur,i);if(opt.done)opt.done();}
  if(opt.instant||rm||dist<.0001){fin();return;}
  var dur=opt.ms||clamp(dist*6600,700,2600),st0=null;
  function step(now){
    if(st0===null)st0=now;
    var k=clamp((now-st0)/dur,0,1),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    if(k>=1){fin();return;}
    cur=from+(target-from)*e;
    var i=draw(cur);if(opt.onFrame)opt.onFrame(cur,i);
    raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}
useSp('sakura');
return {
  species:function(k,sd){useSp(k,sd);return this;},
  reseed:function(sd){seed=sd;tree=build(seed);},
  draw:function(d){cur=d;return draw(d);},
  frag:function(p,o){o=o||{};o.frag=true;return render(p,o);},
  go:go,
  prog:progOf,
  cur:function(){return cur;},
  setCur:function(d){cur=d;}
};
}

/* ===== 季节花期：[一年中的第几天, 花苞→盛开进度 open, 花的不透明度 alpha]，两点之间线性插值 =====
   樱花：2 月中萌芽、3 月下旬盛开、4 月中旬花谢；月季：春到秋反复开花（盛夏略少）；波斯菊：夏末到深秋 */
var PA_SEASON={
 sakura:[[0,0,0],[46,0,1],[84,1,1],[100,1,1],[118,1,0],[365,0,0]],
 rose:[[0,0,0],[100,0,1],[125,1,1],[166,1,1],[200,1,.7],[258,1,1],[320,1,1],[339,1,0],[365,0,0]],
 cosmos:[[0,0,0],[196,0,1],[232,1,1],[304,1,1],[329,1,0],[365,0,0]]};
function plantSeason(k,date){
  var d=date||new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000),kf=PA_SEASON[k]||PA_SEASON.sakura,i,a,b,t;
  for(i=1;i<kf.length;i++)if(doy<=kf[i][0])break;
  if(i>=kf.length)i=kf.length-1;
  a=kf[i-1];b=kf[i];t=b[0]===a[0]?1:(doy-a[0])/(b[0]-a[0]);
  var open=a[1]+(b[1]-a[1])*t,alpha=a[2]+(b[2]-a[2])*t,label;
  if(alpha<.05||open<.05)label='休花期';else if(open<.6)label='含苞待放';else if(alpha<.6)label='花谢了';else label='盛开中';
  return {open:open,alpha:alpha,label:label};
}
/* ===== 博物馆：把换代时留下的老植物移栽进大花盆。items=[{k:品种, seed:种子, gen:第几代}]，每盆最多 5 株，
   植物长到最终形态，花按季节开合。返回 {html: 一个或多个 <svg>, notes:[{gen,k,label}]} ===== */
function plantMuseum(items,date){
  var perPot=5,pots=[],notes=[],i,j;
  for(i=0;i<items.length;i+=perPot)pots.push(items.slice(i,i+perPot));
  var html='';
  pots.slice().reverse().forEach(function(pot,ri){
    var pi=pots.length-1-ri,W=640,H=350,P='mp'+pi,n=pot.length;
    var xs=n===1?[320]:pot.map(function(_,q){return 118+q*(404/(n-1));});
    var dy=[6,-8,10,-6,4],plants=pot.map(function(it,q){
      var sv=document.createElementNS('http://www.w3.org/2000/svg','svg'),pa=new PlantArt(sv);
      pa.species(it.k,it.seed);
      var se=plantSeason(it.k,date),y=262+dy[q%5],s=.74+(y-254)*.012;
      var f=pa.frag(1,{idp:P+'p'+q+'-',season:se,phase:q*1.7});
      notes.push({gen:it.gen,k:it.k,label:se.label});
      return {y:y,html:'<g transform="translate('+(xs[q]-150*s).toFixed(1)+' '+(y-272.2*s).toFixed(1)+')scale('+s.toFixed(3)+')">'+f.html+'</g>'};
    });
    plants.sort(function(a,b){return a.y-b.y;});
    var sp='';for(j=0;j<26;j++){var cx=60+((j*97)%520),cy=262+(((j*53)%30)-15)*.9;if(Math.pow((cx-320)/276,2)+Math.pow((cy-262)/20,2)<.9)sp+='<circle cx="'+cx+'" cy="'+cy.toFixed(1)+'" r="'+(0.8+(j%3)*.3)+'" fill="'+(j%2?'#fff':'#000')+'" opacity="'+(j%2?.14:.2)+'"/>';}
    html+='<svg viewBox="0 30 '+W+' '+(H-30)+'" role="img" aria-label="移栽到大花盆里的老植物" style="width:100%;height:auto;display:block">'
     +'<defs><linearGradient id="'+P+'g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--potd)"/><stop offset=".3" style="stop-color:var(--pot)"/><stop offset=".62" style="stop-color:var(--pot)"/><stop offset="1" style="stop-color:var(--potd)"/></linearGradient>'
     +'<linearGradient id="'+P+'m" gradientUnits="userSpaceOnUse" x1="0" y1="296" x2="0" y2="346"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>'
     +'<mask id="'+P+'k" maskUnits="userSpaceOnUse" x="0" y="0" width="'+W+'" height="'+H+'"><rect width="'+W+'" height="'+H+'" fill="url(#'+P+'m)"/></mask>'
     +'<clipPath id="'+P+'s"><ellipse cx="320" cy="262" rx="278" ry="20"/></clipPath></defs>'
     +'<g mask="url(#'+P+'k)"><path d="M36 270H604L572 346H68Z" fill="url(#'+P+'g)"/>'
     +'<path d="M38 262C34 264 34 270 38 274A290 28 0 0 0 602 274C606 270 606 264 602 262Z" fill="url(#'+P+'g)"/>'
     +'<ellipse cx="320" cy="262" rx="292" ry="26" fill="url(#'+P+'g)"/><ellipse cx="320" cy="262" rx="292" ry="26" fill="var(--potl)" opacity=".4"/>'
     +'<ellipse cx="320" cy="261.6" rx="284" ry="22.5" fill="var(--potd)"/></g>'
     +'<ellipse cx="320" cy="262" rx="278" ry="20" fill="var(--soil)"/><g clip-path="url(#'+P+'s)">'+sp+'</g>'
     +plants.map(function(p){return p.html;}).join('')+'</svg>';
  });
  return {html:html,notes:notes};
}

(function(){
var svg=document.getElementById('s'),pa=document.getElementById('pa'),r=document.getElementById('r'),st=document.getElementById('st'),dv=document.getElementById('dv'),nt=document.getElementById('nt'),dor=document.getElementById('dor');
var P=new PlantArt(svg),dormant=false,spk='sakura',sdI=document.getElementById('sd'),stI=document.getElementById('stm');
var nw=new Date();function p2(n){return (n<10?'0':'')+n;}
sdI.value=nw.getFullYear()+'-'+p2(nw.getMonth()+1)+'-'+p2(nw.getDate());stI.value=p2(nw.getHours())+':'+p2(nw.getMinutes());
function curSeed(){var t=new Date(sdI.value+'T'+(stI.value||'00:00')).getTime();return plantSeedFromTime(isNaN(t)?Date.now():t);}
var seed=curSeed();
function onFrame(d,i){st.textContent=i.name;}
function show(n){dv.textContent='累计养分 '+n;}
function note(){
  nt.textContent=dormant?'一周没施肥后植物进入休眠：停止摇摆、颜色变淡，不会枯死。再施一次肥就恢复。':'拖动滑块或点「施肥 +10」：枝条伸长、花苞变大、花慢慢张开。老枝偏棕、新梢翠绿；樱花一簇几朵、短梗下垂，月季与波斯菊是长梗单朵。';
}
function setDormant(v){
  dormant=v;pa.classList.toggle('dormant',v);dor.classList.toggle('on',v);dor.setAttribute('aria-pressed',v);
  dor.textContent=v?'施肥恢复':'模拟休眠';note();
}
function to(n,ms){show(n);P.go(P.prog(n),{onFrame:onFrame,ms:ms});}
P.species(spk,seed);
document.getElementById('sp').addEventListener('change',function(){spk=this.value;P.species(spk,seed);P.go(P.prog(+r.value),{instant:true,onFrame:onFrame});});
r.addEventListener('input',function(){if(dormant)setDormant(false);to(+r.value,380);});
function reseed(){seed=curSeed();P.reseed(seed);P.go(P.prog(+r.value),{instant:true,onFrame:onFrame});museum();}
sdI.addEventListener('input',reseed);stI.addEventListener('input',reseed);
document.getElementById('ck').addEventListener('click',function(){
  if(dormant)setDormant(false);
  r.value=Math.min(2200,+r.value+10);to(+r.value);
});
dor.addEventListener('click',function(){setDormant(!dormant);});
var mo=document.getElementById('mo');
for(var mi=1;mi<=12;mi++){var op=document.createElement('option');op.value=mi;op.textContent=mi+' 月';mo.appendChild(op);}
mo.value=nw.getMonth()+1;
function museum(){
  var d=new Date(nw.getFullYear(),+mo.value-1,15);
  var sd0=curSeed(),items=[{k:'sakura',seed:sd0,gen:1},{k:'rose',seed:sd0+7919,gen:2},{k:'cosmos',seed:sd0+104729,gen:3}];
  var m=plantMuseum(items,d);
  document.getElementById('mu').innerHTML=m.html;
  var nm={sakura:'樱花',rose:'月季',cosmos:'波斯菊'};
  document.getElementById('mn').textContent=m.notes.map(function(x){return '第'+x.gen+'代 '+nm[x.k]+'：'+x.label;}).join('　');
}
mo.addEventListener('change',museum);
note();show(+r.value);P.species(spk,seed);P.go(P.prog(+r.value),{instant:true,onFrame:onFrame});museum();
})();
</script>
