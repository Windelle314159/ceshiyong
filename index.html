<style>
:root{--bg:#EDF1F3;--card:#FFFFFF;--ink:#12212B;--mute:#586873;--line:#D3DCE1;--acc:#0B6E8E;--on:#FFFFFF;--hi:#FFE680;--ok:#3E7A58;--warn:#B3461F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1920;--card:#16252E;--ink:#E7EFF3;--mute:#98A9B4;--line:#2A3B46;--acc:#58BAD8;--on:#06232E;--hi:#6A5A17;--ok:#82BA99;--warn:#EE8F72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1920;--card:#16252E;--ink:#E7EFF3;--mute:#98A9B4;--line:#2A3B46;--acc:#58BAD8;--on:#06232E;--hi:#6A5A17;--ok:#82BA99;--warn:#EE8F72;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font:400 14px/1.4 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:var(--mute);margin:4px 0 0}
.sub{color:var(--mute);font-size:14px;margin:4px 0 10px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit}
.tabs button[aria-selected=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nav button,.late{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
.nav button:disabled{opacity:.35}
.ttl{flex:1;text-align:center;display:flex;flex-direction:column;line-height:1.3}.ttl span{font-size:12px;color:var(--mute)}
.g{font-weight:700;color:var(--acc);margin:12px 0 2px}.g:first-child{margin-top:0}
.t{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.t input{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);flex:none}
.t.d span{color:var(--mute);text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column}.cell b{font-size:22px}.cell span{font-size:12px;color:var(--mute)}
.late{margin-top:10px;width:100%;border-color:var(--warn);color:var(--warn)}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:6px 8px;align-items:center;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:14px}
.row.now{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.row.lag .ct{color:var(--warn)}
.ck{grid-column:1/-1;background:var(--hi);color:var(--ink);font-style:normal;font-size:12px;padding:2px 8px;border-radius:6px;justify-self:start}
input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.plus{display:block;margin:4px 0 -6px auto;border:0;background:none;color:var(--mute);opacity:.16;font-size:20px;line-height:1;padding:6px 10px}
.plus:hover,.plus:focus-visible{opacity:.8}
.addrow{display:flex;gap:8px;margin-top:8px;align-items:center}
.addrow button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px}
.bk{margin-top:18px;color:var(--mute);font-size:13px}.bk summary{padding:6px 0}.bk textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px}.bkm{margin-top:8px;min-height:1em}
.mv{border:0;background:none;color:var(--mute);opacity:.55;font-size:12px;padding:4px 6px;margin-left:auto;flex:none;font-family:inherit}
.mv:hover,.mv:focus-visible{opacity:1}
.x{border:0;background:none;color:var(--mute);opacity:.3;font-size:18px;line-height:1;padding:2px 6px;margin-left:auto;flex:none}
.x:hover,.x:focus-visible{opacity:1}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.hw{font-style:normal;font-size:12px;color:var(--mute);text-align:center}
.hc{position:relative;border:1px solid var(--line);border-radius:8px;padding:4px 0;min-height:46px;background:color-mix(in srgb,var(--ok) var(--p,0%),var(--card));color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.hc.e{border:none;background:none}
.hc.fut{border-style:dashed}
.hc.lag{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.hc.now{outline:2px solid var(--acc);outline-offset:1px}
.hc b{font-size:14px;font-weight:600}.hc span{font-size:10px;opacity:.75}
.hc u{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
