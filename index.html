<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>植物生长 demo</title>
<style>
:root{--bg:#e6eee4;--ink:#1f3326;--soft:#5d7565;--btn:#2f5a3c;--btnt:#f2f7ef;--leaf2:#a3c45a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--ink:#dce8d8;--soft:#8fa795;--btn:#a9cf86;--btnt:#14201a;--leaf2:#c2de72}}
:root[data-theme="dark"]{--bg:#14201a;--ink:#dce8d8;--soft:#8fa795;--btn:#a9cf86;--btnt:#14201a;--leaf2:#c2de72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
main{width:100%;max-width:420px;padding:20px 20px 32px;box-sizing:border-box}
h1{font-size:20px;margin:8px 0 2px;font-weight:600}
p.sub{margin:0 0 8px;color:var(--soft);font-size:14px}
.stage{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 4px}
.stage b{font-size:18px}
.stage span{color:var(--soft);font-size:14px}
input[type=range]{width:100%;accent-color:var(--btn);margin:8px 0 14px}
.row{display:flex;gap:10px;margin-bottom:10px}
select{flex:1;font:inherit;font-size:15px;padding:11px 6px;border-radius:10px;border:1.5px solid var(--btn);background:var(--bg);color:var(--ink)}
button{flex:1;font:inherit;font-size:15px;padding:11px 0;border-radius:10px;border:1.5px solid var(--btn);background:transparent;color:var(--ink);cursor:pointer}
button.on{background:var(--btn);color:var(--btnt)}
button:focus-visible,input:focus-visible{outline:3px solid var(--leaf2);outline-offset:2px}
.fld{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--soft)}
.fld input{font:inherit;font-size:15px;padding:9px 6px;border-radius:10px;border:1.5px solid var(--btn);background:var(--bg);color:var(--ink);min-width:0}
.mh{font-size:16px;margin:22px 0 8px;font-weight:600}
.note{margin-top:14px;font-size:13px;color:var(--soft);line-height:1.6;min-height:42px}
.plantart{--stem:#4a6b3a;--wood:#8a6a4a;--leaf1:#6f9f4a;--leaf2:#a3c45a;--leafd:#4c7d38;--bloomc:#e9b44c;--potd:#a9bda6;--potl:#dbe7d7;--soil:#7a5c43;--pot:#c9d8c5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .plantart{--stem:#7fa062;--wood:#a8845c;--leaf1:#8fbf5f;--leaf2:#c2de72;--leafd:#5f9546;--potd:#1a291f;--potl:#33503d;--soil:#6b5039;--pot:#223328}}
:root[data-theme="dark"] .plantart{--stem:#7fa062;--wood:#a8845c;--leaf1:#8fbf5f;--leaf2:#c2de72;--leafd:#5f9546;--potd:#1a291f;--potl:#33503d;--soil:#6b5039;--pot:#223328}
.plantart svg{width:100%;height:auto;display:block;transition:filter .6s ease}
.pa-sway{transform-origin:150px 267.8px;animation:pa-sway 5s ease-in-out infinite alternate}
.plantart.dormant .pa-sway{animation:none}
.plantart.dormant svg{filter:saturate(.35) brightness(.95)}
@keyframes pa-sway{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
@media (prefers-reduced-motion:reduce){.pa-sway{animation:none}}

</style>
</head>
<body>
<main id="app">
  <h1>此事有记 · 植物 demo</h1>
  <p class="sub">全部由代码生成，没有任何图片素材；生长只由施肥养分决定</p>
  <div class="plantart" id="pa"><svg id="s" viewBox="0 0 300 320" role="img" aria-label="随养分生长的植物"></svg></div>
  <div class="stage"><b id="st"></b><span id="dv"></span></div>
  <input id="r" type="range" min="0" max="2200" step="5" value="900" aria-label="累计养分">
  <div class="row">
    <select id="sp" aria-label="品种"><option value="sakura">樱花</option><option value="rose">月季</option><option value="cosmos">波斯菊</option></select>
  </div>
  <div class="row">
    <label class="fld">种子日期<input type="date" id="sd" aria-label="种子日期"></label>
    <label class="fld">种子时刻<input type="time" id="stm" aria-label="种子时刻"></label>
  </div>
  <div class="row">
    <button id="ck">施肥 +10</button>
    <button id="dor" aria-pressed="false">模拟休眠</button>
  </div>
  <div class="note" id="nt"></div>
  <h2 class="mh">博物馆 · 换代后移栽的老植物</h2>
  <div class="row"><select id="mo" aria-label="预览月份"></select></div>
  <div class="plantart" id="mu"></div>
  <div class="note" id="mn"></div>
</main>
<script>
/* ===== PlantArt：纯代码生成的 SVG 植物。new PlantArt(svgElement)
   生长进度 prog∈[0,1] 完全由施肥累计的养分决定（PlantArt.prog(养分)），与天数无关 ===== */
function paHash(x){x=x>>>0;x^=x>>>16;x=Math.imul(x,0x85ebca6b);x^=x>>>13;x=Math.imul(x,0xc2b2ae35);x^=x>>>16;return x>>>0;}
/* 种子 = f(时刻, 日期)：x=一天中的第几分钟，y=第几天。两个变量各自先散列再混合——
   只要时刻不同或日期不同，种子就不同、长出来的植物不同；时刻和日期都相同（精确到分钟）才会一样 */
function plantSeedFromTime(ms){
  var d=new Date(ms),min=d.getHours()*60+d.getMinutes(),day=Math.floor((ms-d.getTimezoneOffset()*60000)/86400000);
  var hx=paHash(Math.imul(min+1,2654435761)),hy=paHash(Math.imul(day,40503)^0x5bd1e995);
  return ((hx^Math.imul(hy,0x27d4eb2d))>>>0)||1;
}
function PlantArt(svg){
var seed=7,D=4,tree,S,cur=0,raf=0,T0=performance.now(),dk=false,ID='',lid=0;
var PI=Math.PI;
/* 品种：参数决定生长姿态（分枝角度、主干优势、向上程度）和花形。
   wd=木质化程度（樱花木本、月季半木本、波斯菊草本几乎不变棕）；pl/dr/pw=花梗长度范围/下垂程度/粗细 */
var SP={
sakura:{k:'sakura',D:4,rl:58,rw:6,r:.74,sr:.58,sc:[6,14],ss:[26,40],bend:.08,pull:.15,pk:.7,nl:3,la:[40,60],ls:1,lw:.5,fp:.3,fs:1,bt:[22,52],wd:1,pl:[12,17],dr:.75,pw:.9,
 pal:[{l:'#f6d3d8',m:'#efb3c0',d:'#dd8499'},{l:'#fbf3f4',m:'#f4dfe3',d:'#e3a9b6'},{l:'#f0a8bc',m:'#e48aa4',d:'#cc5478'},{l:'#ecd0e6',m:'#dcb0d2',d:'#b878ac'}],c:null},
rose:{k:'rose',D:3,rl:72,rw:5,r:.82,sr:.62,sc:[3,9],ss:[22,34],bend:.06,pull:.25,pk:.5,nl:3,la:[45,65],ls:1.15,lw:.6,fp:.35,fs:1.3,bt:[28,58],wd:.75,pl:[14,19],dr:0,pw:1.8,
 pal:[{l:'#e8607a',m:'#d03a5a',d:'#9c1f3d'},{l:'#f6b8c4',m:'#ee93a6',d:'#d0546f'},{l:'#f8e08a',m:'#f0c850',d:'#d49a1e'},{l:'#fdf6f0',m:'#f2e0d8',d:'#d9a898'},{l:'#f9b08c',m:'#f08a64',d:'#d0583a'}],c:{'--bloomc':'#e9b44c'}},
cosmos:{k:'cosmos',D:3,rl:66,rw:3.4,r:.8,sr:.64,sc:[3,8],ss:[24,38],bend:.08,pull:.3,pk:.55,nl:4,la:[50,75],ls:1,lw:.16,fp:.3,fs:1.1,bt:[62,82],wd:.12,pl:[15,21],dr:.12,pw:1.2,
 pal:[{l:'#f9c7de',m:'#ee8fba',d:'#c2428a'},{l:'#ffffff',m:'#f3e8f0',d:'#d6a4c4'},{l:'#fbc97a',m:'#f5a03c',d:'#d8701a'},{l:'#e86aa8',m:'#cf3f86',d:'#9c1f62'}],c:{'--bloomc':'#f0b730'}}};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
var f1=function(v){return v.toFixed(1)};
function isDark(){var h=document.documentElement.getAttribute('data-theme');return h==='dark'||(h!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
/* 深色模式下花色压暗一点、略降饱和（固定十六进制不会跟 CSS 变量走，所以在生成渐变时处理） */
function tone(hex){
  if(!dk)return hex;
  var n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,l=.299*r+.587*g+.114*b;
  function m(c){return Math.round(clamp(c*.8+l*.1,0,255))}
  return '#'+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1);
}
/* 养分 → 生长进度。锚点对齐 app 的阶段门槛：80 破土、220 抽枝、450 长叶、800 开始分化花苞、1300、2200 满开 */
var MAP=[[0,0],[80,.02],[220,.17],[450,.43],[800,.75],[1300,.9],[2200,1]],SEED=.012;
function progOf(n){
  if(!(n>0))return 0;if(n>=MAP[MAP.length-1][0])return 1;
  for(var i=1;i<MAP.length;i++)if(n<=MAP[i][0]){var a=MAP[i-1],b=MAP[i];return a[1]+(b[1]-a[1])*(n-a[0])/(b[0]-a[0]);}
  return 1;
}
function useSp(k,sd){
  S=SP[k];if(sd)seed=sd;
  svg.style.removeProperty('--bloomc');
  if(S.c)for(var v in S.c)svg.style.setProperty(v,S.c[v]);
  tree=build(seed);settle();
}

/* 叶子去重：把整株长齐后画一遍，记录每片叶的位置；如果后面的叶子和前面某片叶重叠得太厉害
   （轴线上 5 个采样点至少 4 个落在对方叶宽范围内），就不画后面这片，避免两片叶子叠成一团、叶柄挤在一起 */
function ptSeg(px,py,a){
  var vx=a.dx*a.L,vy=a.dy*a.L,t=clamp(((px-a.x)*vx+(py-a.y)*vy)/(vx*vx+vy*vy),0,1),cx=a.x+vx*t,cy=a.y+vy*t;
  return Math.sqrt((px-cx)*(px-cx)+(py-cy)*(py-cy));
}
function clash(a,b){
  var thr=(a.w+b.w)*.5+.2,h1=0,h2=0,k,t;
  for(k=0;k<5;k++){
    t=(k+.5)/5;
    if(ptSeg(b.x+b.dx*b.L*t,b.y+b.dy*b.L*t,a)<thr)h1++;
    if(ptSeg(a.x+a.dx*a.L*t,a.y+a.dy*a.L*t,b)<thr)h2++;
  }
  return h1>=4||h2>=4;
}
function settle(){
  var rec=[],kept=[];
  render(1,{dry:rec});
  rec.forEach(function(c){
    var i;c.l.hide=false;
    for(i=0;i<kept.length;i++)if(clash(kept[i],c)){c.l.hide=true;return;}
    kept.push(c);
  });
}

/* 整株植物的形状只在这里生成一次，之后天数变化只改变"长到哪一步" */
function build(sd){
  var R=rng(sd),terms=[],rr=function(a){return a[0]+(a[1]-a[0])*R()};
  D=S.D;
  /* 主干优势：续生枝只小角度偏离并被拉向竖直，侧枝反向、更大角度、更短更细；弯曲很小，不是藤蔓 */
  function mk(a,len,w,d){
    var n={a:a,len:len,w:w,d:d,bend:(R()-.5)*2*S.bend,leaves:[],kids:[],tip:null,fls:null};
    var nl=d===0?S.nl:2;
    for(var i=0;i<nl;i++)n.leaves.push({t:.25+.45*R(),side:i%2?1:-1,ang:S.la[0]+R()*(S.la[1]-S.la[0]),s:(7+R()*3)*S.ls*(1.1-d*.1),tone:R()>.5});
    /* 同一侧的叶子沿枝至少隔开 .2（不调用 R，不改树形），避免两片叶子挤在同一处、两根叶柄叠在一起；
       再给每片叶一个确定的前/后：后叶画在枝的下面（被枝挡住），前叶画在枝的上面，遮挡关系有前有后 */
    [-1,1].forEach(function(sd){
      var ls=n.leaves.filter(function(l){return l.side===sd}).sort(function(p,q){return p.t-q.t});
      for(var k=1;k<ls.length;k++)if(ls[k].t-ls[k-1].t<.2)ls[k].t=Math.min(.88,ls[k-1].t+.2);
    });
    n.leaves.forEach(function(l,i){l.back=paHash(Math.round(a*100)+i*7919+d*104729+(l.side>0?5:0))%100<38;});
    if(d<D){
      var two=R()<S.pk,sg=R()>.5?1:-1,ca=a+sg*rr(S.sc),sa=a-sg*rr(S.ss);
      ca+=(-90-ca)*S.pull;sa+=(-90-sa)*S.pull;
      n.kids.push(mk(ca,len*S.r*(.95+.1*R()),w*.68,d+1));
      if(two){var sk=mk(sa,len*S.sr*(.95+.1*R()),w*.5,d+1);sk.side=true;n.kids.push(sk);}
    }else{n.tip={ang:(R()-.5)*30,s:10,tone:R()>.5};terms.push(n);}
    return n;
  }
  var root=mk(-90,S.rl,S.rw,0),fl=[],N=0;
  terms.forEach(function(n){if(R()>S.fp)fl.push(n)});
  if(!fl.length)fl.push(terms[0]);
  /* 每个开花的枝梢带一簇花：樱花 1–3 朵、短花梗、略微下垂；月季/波斯菊单朵长花梗。
     每朵花有自己的开始时间、朝向、大小和盛开形态 */
  fl.forEach(function(n,i){
    var k=S.k==='sakura'?1+(R()<.8?1:0)+(R()<.35?1:0):1,base=.81+.07*(i/Math.max(1,fl.length-1));
    n.fls=[];
    for(var j=0;j<k;j++){
      var f={s:base+j*.01+R()*.01,r:R()*360,v:(i+j+Math.floor(R()*3))%3,b:rr(S.bt),c:Math.floor(R()*S.pal.length),sc:(.88+R()*.26)*(k>1?.86:1)};
      var off=S.k==='sakura'?(k===1?(R()-.5)*30:-50+100*(j/(k-1))+(R()-.5)*16):(R()-.5)*10;
      n.fls.push({f:f,p:{off:off,len:rr(S.pl),dr:S.dr}});
      N++;
    }
  });
  return {root:root,N:N};
}

/* 叶子：沿一条微弯的叶轴生成叶形（基部尖、最宽处偏下、尖端渐收），cu 为尖端下垂量。
   中脉是从基部向叶尖渐细的实心形，侧脉是极细的弧线，不再是一根等粗的线 */
/* 把一串点用 Catmull-Rom 变成平滑的三次曲线 */
function smooth(P){
  var d='',n=P.length-1,i,p0,p1,p2,p3;
  for(i=0;i<n;i++){
    p0=P[Math.max(0,i-1)];p1=P[i];p2=P[i+1];p3=P[Math.min(n,i+2)];
    d+='C'+f1(p1[0]+(p2[0]-p0[0])/6)+' '+f1(p1[1]+(p2[1]-p0[1])/6)+' '+f1(p2[0]-(p3[0]-p1[0])/6)+' '+f1(p2[1]-(p3[1]-p1[1])/6)+' '+f1(p2[0])+' '+f1(p2[1]);
  }
  return d;
}
function leaf(arr,x,y,a,s,tone,cu,pw){
  if(s<1.2)return;
  var L=s*1.9,w=s*S.lw*.8,c=(cu||0)*L,N=14,i,t,k;
  function mid(t){return [c*t*t,-L*t];}
  function fr(t){var tx=2*c*t,ty=-L,m=Math.sqrt(tx*tx+ty*ty);return [tx/m,ty/m];}   /* 主脉前进方向 */
  function hwf(t){return w*(t<.42?Math.sin(Math.PI/2*Math.pow(t/.42,1.35)):Math.cos(Math.PI/2*Math.pow((t-.42)/.58,.95)));}
  function edge(t,sd,off){var m=mid(t),f=fr(t),h=hwf(t)*(sd>0?1.05:.95)+(off||0);return [m[0]+(-f[1])*sd*h,m[1]+f[0]*sd*h];}
  /* 樱花、月季的叶缘有细锯齿：沿叶缘每隔一小段有一个朝向叶尖的小尖齿（缓坡在前、陡坡在后），齿深随叶宽收窄，到叶尖和叶基自然消失；
     其余（波斯菊）和很小的叶子保持光滑 */
  var tooth=(S.k==='sakura'||S.k==='rose')&&L>=6,nT=tooth?clamp(Math.round(L*1.15),10,26):0,dT=clamp(L*.016,.1,.3);
  function outline(sd){
    var P=[],T=[],j;
    if(!tooth){for(j=0;j<=N;j++)T.push([j/N,0]);}
    else{
      T.push([0,0],[.05,0],[.1,0]);
      for(j=0;j<nT;j++){
        var t0=.1+.88*j/nT,t1=.1+.88*(j+1)/nT,env=Math.min(1,hwf(t0+(t1-t0)*.7)/(w*.55));
        T.push([t0,0],[t0+(t1-t0)*.72,dT*env]);
      }
      T.push([1,0]);
    }
    for(j=0;j<T.length;j++)P.push(edge(T[j][0],sd,T[j][1]));
    return {P:P,T:T};
  }
  var oA=outline(1),oB=outline(-1);
  function pathOf(P,close){return 'M'+f1(P[0][0])+' '+f1(P[0][1])+(tooth?'L'+P.slice(1).map(function(p){return f1(p[0])+' '+f1(p[1]);}).join('L'):smooth(P));}
  var col=tone?'var(--leaf1)':'var(--leaf2)',o='<g transform="translate('+f1(x)+' '+f1(y)+')rotate('+(a+90).toFixed(0)+')">';
  var Br=oB.P.slice().reverse();
  o+='<path d="'+pathOf(oA.P)+(tooth?'L'+Br.map(function(p){return f1(p[0])+' '+f1(p[1]);}).join('L'):smooth(Br))+'Z" fill="'+col+'" stroke="'+col+'" stroke-width=".12" stroke-linejoin="round"/>';
  /* 背光一侧略深 */
  var H=oB.T.map(function(tt){return mid(tt[0]);}).reverse();
  o+='<path d="'+pathOf(oB.P)+(tooth?'L'+H.map(function(p){return f1(p[0])+' '+f1(p[1]);}).join('L'):smooth(H))+'Z" fill="var(--leafd)" opacity=".2"/>';
  /* 主脉 = 叶柄的延长：起点半宽严格等于叶柄末端半宽（叶柄本身不会比所在的枝粗），往叶尖平滑变细；颜色从茎色渐变到叶脉色 */
  var pw2=Math.max(.08,(pw||0)/2),gid=ID+'pa-lm'+(lid++);
  function mwAt(u){return pw2*Math.pow(1-u,1.35)+.035*(1-u);}
  var M1=[[pw2,.3]],M2=[[-pw2,.3]];
  for(i=0;i<=N-1;i++){
    var u=i/N,m0=mid(u),f0=fr(u),mw=mwAt(u);
    M1.push([m0[0]-f0[1]*mw,m0[1]+f0[0]*mw]);M2.push([m0[0]+f0[1]*mw,m0[1]-f0[0]*mw]);
  }
  var tipP=mid((N-1)/N);M1.push(tipP);
  var grad='<defs><linearGradient id="'+gid+'" gradientUnits="userSpaceOnUse" x1="0" y1=".3" x2="0" y2="'+f1(-L*.55)+'"><stop offset="0" style="stop-color:var(--stem)"/><stop offset="1" style="stop-color:var(--leafd);stop-opacity:.6"/></linearGradient></defs>';
  /* 次脉像次干：从主脉上以锐角分出（先沿 ~50° 方向离开主脉，再逐渐转向叶缘），
     基部宽度约为该处主脉的一半、末端渐尖，颜色取同一处主脉的颜色，所以主脉→次脉是同一套"枝干"，不画到叶缘 */
  var vein='';
  if(w>=2.2){
    var nv=w>=4.2?4:w>=3?3:2;
    for(k=0;k<nv;k++){
      [1,-1].forEach(function(sd){
        var tb=.17+.15*k+(sd>0?0:.06),te=Math.min(.9,tb+.22);
        var B0=mid(tb),f0=fr(tb),nn=[-f0[1]*sd,f0[0]*sd],E=edge(te,sd,-hwf(te)*.2);

/* 生长过渡：把显示的天数从当前值缓动到 target（枝条伸长、花慢慢张开）。reduced-motion 下直接跳到目标 */
function go(target,opt){
  opt=opt||{};cancelAnimationFrame(raf);
  var from=cur,dist=Math.abs(target-from),rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fin(){cur=target;var i=draw(cur);if(opt.onFrame)opt.onFrame(cur,i);if(opt.done)opt.done();}
  if(opt.instant||rm||dist<.0001){fin();return;}
  var dur=opt.ms||clamp(dist*6600,700,2600),st0=null;
  function step(now){
    if(st0===null)st0=now;
    var k=clamp((now-st0)/dur,0,1),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    if(k>=1){fin();return;}
    cur=from+(target-from)*e;
    var i=draw(cur);if(opt.onFrame)opt.onFrame(cur,i);
    raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}

/* ===== 季节花期：[一年中的第几天, 花苞→盛开进度 open, 花的不透明度 alpha]，两点之间线性插值 =====
   樱花：2 月中萌芽、3 月下旬盛开、4 月中旬花谢；月季：春到秋反复开花（盛夏略少）；波斯菊：夏末到深秋 */
var PA_SEASON={
 sakura:[[0,0,0],[46,0,1],[84,1,1],[100,1,1],[118,1,0],[365,0,0]],
 rose:[[0,0,0],[100,0,1],[125,1,1],[166,1,1],[200,1,.7],[258,1,1],[320,1,1],[339,1,0],[365,0,0]],
 cosmos:[[0,0,0],[196,0,1],[232,1,1],[304,1,1],[329,1,0],[365,0,0]]};
function plantSeason(k,date){
  var d=date||new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000),kf=PA_SEASON[k]||PA_SEASON.sakura,i,a,b,t;
  for(i=1;i<kf.length;i++)if(doy<=kf[i][0])break;
  if(i>=kf.length)i=kf.length-1;
  a=kf[i-1];b=kf[i];t=b[0]===a[0]?1:(doy-a[0])/(b[0]-a[0]);
  var open=a[1]+(b[1]-a[1])*t,alpha=a[2]+(b[2]-a[2])*t,label;
  /* wilt：花谢进度 0→1。只出现在“盛开→不透明度降到 0”的那一段；盛夏月季的 .7 只是花变少，不算花谢 */
  var wilt=(b[2]<a[2]&&b[2]===0)?Math.max(0,Math.min(1,t)):0;
  if(alpha<.05||open<.05)label='休花期';else if(open<.6)label='含苞待放';else if(wilt>.12||alpha<.6)label='花谢了';else label='盛开中';
  return {open:open,alpha:alpha,label:label,wilt:wilt};
}
/* ===== 博物馆：留种后的老植物，每株单独一盆（和植物页同款花盆）。items=[{k:品种, seed:种子, gen:第几代}]，
   植物长到最终形态，花按季节开合；花谢期花瓣会飘落。返回 {html: 网格(每株一个 <svg>), notes:[{gen,k,label}]} ===== */
function plantMuseum(items,date){
  var notes=[],cells=[];
  items.forEach(function(it,q){
    var sv=document.createElementNS('http://www.w3.org/2000/svg','svg'),pa=new PlantArt(sv);
    pa.species(it.k,it.seed);
    var se=plantSeason(it.k,date),r=pa.pot(1,{idp:'mp'+q+'-',season:se,phase:q*1.7});
    notes.push({gen:it.gen,k:it.k,label:se.label});
    cells.push('<svg viewBox="0 20 300 300" role="img" aria-label="移栽到花盆里的老植物" style="width:100%;height:auto;display:block">'+r.html+'</svg>');
  });
  /* 最新的一代排在最前；只有一株时居中、不撑满 */
  var html='<div style="display:grid;grid-template-columns:'+(items.length>1?'repeat(2,minmax(0,1fr))':'minmax(0,1fr)')+';gap:2px 8px'+(items.length>1?'':';max-width:62%;margin:0 auto')+'">'+cells.reverse().join('')+'</div>';
  return {html:html,notes:notes};
}
